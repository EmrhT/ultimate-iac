apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: infra-security-kustomize
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions:
    - missingkey=error
  generators:
    - list:
        elements:
          - name: gateway-api-crds
            namespace: kube-system
            sourceRepo: https://github.com/kubernetes-sigs/gateway-api.git
            revision: v1.5.1
            path: config/crd/standard
            wave: "-40"
          - name: cert-manager-config
            namespace: cert-manager
            sourceRepo: https://github.com/EmrhT/ultimate-iac.git
            revision: main
            path: argocd/infra-security/cert-manager-config/overlays/dev
            wave: "-29"
          - name: metallb-config
            namespace: metallb-system
            sourceRepo: https://github.com/EmrhT/ultimate-iac.git
            revision: main
            path: argocd/infra-security/metallb-config/overlays/dev
            wave: "-24"
          - name: longhorn-config
            namespace: longhorn-system
            sourceRepo: https://github.com/EmrhT/ultimate-iac.git
            revision: main
            path: argocd/infra-security/longhorn-config/overlays/dev
            wave: "-19"
          - name: kube-prometheus-stack-config
            namespace: monitoring
            sourceRepo: https://github.com/EmrhT/ultimate-iac.git
            revision: main
            path: argocd/infra-security/kube-prometheus-stack-config/overlays/dev
            wave: "2"
          - name: cloudflared
            namespace: cloudflare
            sourceRepo: https://github.com/EmrhT/ultimate-iac.git
            revision: main
            path: argocd/infra-security/cloudflared/overlays/dev
            wave: "5"
          - name: elastic-stack
            namespace: elastic-stack
            sourceRepo: https://github.com/EmrhT/ultimate-iac.git
            revision: main
            path: argocd/infra-security/elastic-stack/overlays/dev
            wave: "10"
          - name: keycloak-config
            namespace: keycloak
            sourceRepo: https://github.com/EmrhT/ultimate-iac.git
            revision: main
            path: argocd/infra-security/keycloak-config/overlays/dev
            wave: "14"
          - name: ui-routes
            namespace: argocd
            sourceRepo: https://github.com/EmrhT/ultimate-iac.git
            revision: main
            path: argocd/infra-security/ui-routes/overlays/dev
            wave: "20"
          - name: security-sonarqube-config
            namespace: security-sonarqube
            sourceRepo: https://github.com/EmrhT/ultimate-iac.git
            revision: main
            path: argocd/security-tools/sonarqube/overlays/dev
            wave: "14"
          - name: security-trivy-config
            namespace: security-trivy
            sourceRepo: https://github.com/EmrhT/ultimate-iac.git
            revision: main
            path: argocd/security-tools/trivy/overlays/dev
            wave: "14"
          - name: security-nuclei
            namespace: security-nuclei
            sourceRepo: https://github.com/EmrhT/ultimate-iac.git
            revision: main
            path: argocd/security-tools/nuclei/overlays/dev
            wave: "15"
  template:
    metadata:
      name: '{{ if hasPrefix "security-" .name }}{{ .name }}{{ else }}infra-{{ .name }}{{ end }}'
      namespace: argocd
      annotations:
        argocd.argoproj.io/sync-wave: "{{ .wave }}"
      labels:
        platform.example/group: infra-security
        platform.example/component: "{{ .name }}"
    spec:
      project: infra-security
      source:
        repoURL: "{{ .sourceRepo }}"
        targetRevision: "{{ .revision }}"
        path: "{{ .path }}"
      destination:
        server: https://kubernetes.default.svc
        namespace: "{{ .namespace }}"
      ignoreDifferences:
        - group: apps
          kind: StatefulSet
          name: security-sonarqube-postgresql
          namespace: security-sonarqube
          jsonPointers:
            # Kubernetes retains this generated field in the immutable PVC template.
            - /spec/volumeClaimTemplates/0/status
        - group: apps
          kind: StatefulSet
          name: keycloak-postgresql
          namespace: keycloak
          jsonPointers:
            - /spec/volumeClaimTemplates/0/status
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        retry:
          limit: 20
          backoff:
            duration: 15s
            factor: 2
            maxDuration: 5m
        syncOptions:
          - CreateNamespace=true
          - ServerSideApply=true
          - SkipDryRunOnMissingResource=true
