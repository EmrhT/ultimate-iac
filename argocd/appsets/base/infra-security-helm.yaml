apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: infra-security-helm
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions:
    - missingkey=error
  generators:
    - list:
        elements:
          - name: cert-manager
            namespace: cert-manager
            chartRepo: https://charts.jetstack.io
            chart: cert-manager
            chartVersion: v1.21.0
            wave: "-30"
          - name: metallb
            namespace: metallb-system
            chartRepo: https://metallb.github.io/metallb
            chart: metallb
            chartVersion: 0.16.1
            wave: "-25"
          - name: longhorn
            namespace: longhorn-system
            chartRepo: https://charts.longhorn.io
            chart: longhorn
            chartVersion: 1.11.2
            wave: "-20"
          - name: metrics-server
            namespace: metrics-server
            chartRepo: https://kubernetes-sigs.github.io/metrics-server
            chart: metrics-server
            chartVersion: 3.13.1
            wave: "-15"
          - name: kube-prometheus-stack
            namespace: monitoring
            chartRepo: https://prometheus-community.github.io/helm-charts
            chart: kube-prometheus-stack
            chartVersion: 86.3.2
            wave: "-10"
          - name: traefik
            namespace: traefik
            chartRepo: https://traefik.github.io/charts
            chart: traefik
            chartVersion: 41.0.1
            wave: "0"
          - name: vault
            namespace: vault
            chartRepo: https://helm.releases.hashicorp.com
            chart: vault
            chartVersion: 0.32.0
            wave: "0"
          - name: vault-secrets-operator
            namespace: vault-secrets-operator
            chartRepo: https://helm.releases.hashicorp.com
            chart: vault-secrets-operator
            chartVersion: 1.5.0
            wave: "1"
          - name: keycloak
            namespace: keycloak
            chartRepo: https://codecentric.github.io/helm-charts
            chart: keycloakx
            chartVersion: 7.2.2
            wave: "15"
          - name: kyverno
            namespace: kyverno
            chartRepo: https://kyverno.github.io/kyverno/
            chart: kyverno
            chartVersion: 3.9.0
            wave: "15"
          - name: falco
            namespace: falco
            chartRepo: https://falcosecurity.github.io/charts
            chart: falco
            chartVersion: 9.1.0
            wave: "0"
          - name: eck-operator
            namespace: elastic-system
            chartRepo: https://helm.elastic.co
            chart: eck-operator
            chartVersion: 3.4.0
            wave: "0"
          - name: elastalert2
            namespace: elastic-stack
            chartRepo: https://jertel.github.io/elastalert2/
            chart: elastalert2
            chartVersion: 2.31.0
            wave: "16"
          - name: security-sonarqube
            namespace: security-sonarqube
            chartRepo: https://SonarSource.github.io/helm-chart-sonarqube
            chart: sonarqube
            chartVersion: 2026.4.1
            wave: "15"
          - name: security-trivy
            namespace: security-trivy
            chartRepo: https://aquasecurity.github.io/helm-charts
            chart: trivy
            chartVersion: 0.25.0
            wave: "15"
          - name: security-defectdojo
            namespace: security-defectdojo
            chartRepo: https://raw.githubusercontent.com/DefectDojo/django-DefectDojo/helm-charts
            chart: defectdojo
            chartVersion: 1.9.47
            wave: "15"
  template:
    metadata:
      name: '{{ if hasPrefix "security-" .name }}{{ .name }}{{ else }}infra-{{ .name }}{{ end }}'
      namespace: argocd
      annotations:
        argocd.argoproj.io/sync-wave: "{{ .wave }}"
      labels:
        platform.example/group: infra-security
        platform.example/component: "{{ .name }}"
    spec:
      project: infra-security
      sources:
        - repoURL: "{{ .chartRepo }}"
          chart: "{{ .chart }}"
          targetRevision: "{{ .chartVersion }}"
          helm:
            releaseName: "{{ .name }}"
            # Helm test pods are imperative test hooks rather than desired
            # infrastructure state. Argo CD should not render them.
            skipTests: true
            valueFiles:
              - '$values/argocd/{{ if hasPrefix "security-" .name }}security-tools/{{ trimPrefix "security-" .name }}{{ else }}infra-security/{{ .name }}{{ end }}/base/values.yaml'
              - '$values/argocd/{{ if hasPrefix "security-" .name }}security-tools/{{ trimPrefix "security-" .name }}{{ else }}infra-security/{{ .name }}{{ end }}/overlays/dev/values.yaml'
        - repoURL: https://github.com/EmrhT/ultimate-iac.git
          targetRevision: main
          ref: values
      destination:
        server: https://kubernetes.default.svc
        namespace: "{{ .namespace }}"
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        retry:
          limit: 20
          backoff:
            duration: 15s
            factor: 2
            maxDuration: 5m
        syncOptions:
          - CreateNamespace=true
          - ServerSideApply=true
          - SkipDryRunOnMissingResource=true
  # Kyverno CRDs and Keycloak's Gateway API HTTPRoute contain API-server
  # defaulted fields. The structured-merge diff selected by ServerSideApply
  # reports false drift for these resources.
  templatePatch: |
    {{- if or (eq .name "kyverno") (eq .name "keycloak") }}
    metadata:
      annotations:
        argocd.argoproj.io/compare-options: ServerSideDiff=true
    {{- end }}
