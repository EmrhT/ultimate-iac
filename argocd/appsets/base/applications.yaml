apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: custom-applications
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions:
    - missingkey=error
  generators:
    # Every deployable leaf follows:
    # argocd/applications/<application>/clusters/<cluster>/<environment>
    # Adding or removing one of these directories therefore adds or removes
    # exactly one generated Argo CD Application without changing this file.
    - git:
        repoURL: https://github.com/EmrhT/ultimate-iac.git
        revision: main
        directories:
          - path: argocd/applications/*/clusters/*/*
  template:
    metadata:
      name: '{{ index .path.segments 2 }}-{{ index .path.segments 4 }}-{{ index .path.segments 5 }}'
      namespace: argocd
      labels:
        platform.example/group: applications
        platform.example/application: '{{ index .path.segments 2 }}'
        platform.example/cluster: '{{ index .path.segments 4 }}'
        platform.example/environment: '{{ index .path.segments 5 }}'
    spec:
      project: applications
      source:
        repoURL: https://github.com/EmrhT/ultimate-iac.git
        targetRevision: main
        path: '{{ .path.path }}'
      destination:
        server: https://kubernetes.default.svc
        namespace: '{{ index .path.segments 4 }}-{{ index .path.segments 5 }}'
      # Falco Talon applies this one label only after a critical runtime event.
      # The quarantine CiliumNetworkPolicy is already Git-managed; Argo must not
      # remove the incident-response label while the investigation is active.
      ignoreDifferences:
        - group: ""
          kind: Pod
          jqPathExpressions:
            - '.metadata.labels["security.no-name.win/quarantined"]'
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        retry:
          limit: 10
          backoff:
            duration: 10s
            factor: 2
            maxDuration: 3m
        managedNamespaceMetadata:
          labels:
            platform.example/cluster: '{{ index .path.segments 4 }}'
            platform.example/environment: '{{ index .path.segments 5 }}'
            pod-security.kubernetes.io/enforce: restricted
            pod-security.kubernetes.io/audit: restricted
            pod-security.kubernetes.io/warn: restricted
        syncOptions:
          - CreateNamespace=true
          - ServerSideApply=true
          - RespectIgnoreDifferences=true
