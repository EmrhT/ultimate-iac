grafana:
  enabled: true
  defaultDashboardsEnabled: true
  deploymentStrategy:
    type: Recreate
  persistence:
    enabled: true
    storageClassName: longhorn
    size: 300Mi
prometheus:
  prometheusSpec:
    retention: 1d
    retentionSize: 300MB
    scrapeInterval: 45s
    serviceMonitorSelectorNilUsesHelmValues: false
    podMonitorSelectorNilUsesHelmValues: false
    storageSpec:
      volumeClaimTemplate:
        spec:
          storageClassName: longhorn
          accessModes:
            - ReadWriteOnce
          resources:
            requests:
              storage: 750Mi
alertmanager:
  alertmanagerSpec:
    retention: 24h
