grafana:
  enabled: true
  defaultDashboardsEnabled: true
  admin:
    existingSecret: grafana-admin-credentials
    userKey: admin-user
    passwordKey: admin-password
  serviceMonitor:
    metricRelabelings:
      - action: drop
        sourceLabels:
          - __name__
        # These high-cardinality API-server histograms dominate Grafana's
        # scrape footprint and are not used by the bundled dashboards.
        regex: grafana_feature_toggles_info|grafana_apiserver_request_(duration|slo_duration|sli_duration)_seconds_bucket
  deploymentStrategy:
    type: Recreate
  persistence:
    enabled: true
    storageClassName: longhorn
    size: 300Mi
prometheus:
  prometheusSpec:
    retention: 12h
    # This limits persisted blocks only. WAL, head chunks, and temporary
    # compaction files are additional, so keep substantial PVC headroom.
    retentionSize: 300MB
    scrapeInterval: 60s
    evaluationInterval: 60s
    serviceMonitorSelectorNilUsesHelmValues: false
    podMonitorSelectorNilUsesHelmValues: false
    storageSpec:
      volumeClaimTemplate:
        metadata:
          labels:
            # PVC labels are the source of the Prometheus-only Longhorn jobs.
            recurring-job.longhorn.io/source: enabled
            recurring-job.longhorn.io/prometheus-daily-snapshot: enabled
            recurring-job.longhorn.io/prometheus-daily-snapshot-delete: enabled
            recurring-job.longhorn.io/prometheus-daily-trim: enabled
        spec:
          storageClassName: longhorn
          accessModes:
            - ReadWriteOnce
          resources:
            requests:
              storage: 1536Mi
alertmanager:
  alertmanagerSpec:
    retention: 12h
    # Select only centrally managed AlertmanagerConfig resources from the
    # monitoring namespace. The route itself limits delivery to team=security.
    alertmanagerConfigSelector:
      matchLabels:
        alertmanager-config: enabled
    alertmanagerConfigNamespaceSelector:
      matchLabels:
        kubernetes.io/metadata.name: monitoring
    # Security rules live in several namespaces (for example, Cilium rules are
    # in kube-system), so do not inject a monitoring namespace matcher.
    alertmanagerConfigMatcherStrategy:
      type: None

prometheus-node-exporter:
  daemonsetAnnotations:
    argocd.argoproj.io/ignore-healthcheck: "true"

kubeApiServer:
  serviceMonitor:
    metricRelabelings:
      # Preserve the chart's default bucket reduction rule.
      - action: drop
        regex: (etcd_request|apiserver_request_slo|apiserver_request_sli|apiserver_request)_duration_seconds_bucket;(0\.15|0\.2|0\.3|0\.35|0\.4|0\.45|0\.6|0\.7|0\.8|0\.9|1\.25|1\.5|1\.75|2|3|3\.5|4|4\.5|6|7|8|9|15|20|40|45|50)(\.0)?
        sourceLabels:
          - __name__
          - le
      - action: drop
        sourceLabels:
          - __name__
        regex: apiserver_request_body_size_bytes_bucket|apiserver_response_sizes_bucket|apiserver_watch_list_duration_seconds_bucket|apiserver_watch_cache_read_wait_seconds_bucket|etcd_request_duration_seconds_bucket

kubelet:
  serviceMonitor:
    interval: 60s
    probesMetricRelabelings:
      - action: drop
        sourceLabels:
          - __name__
        regex: prober_probe_duration_seconds_bucket
