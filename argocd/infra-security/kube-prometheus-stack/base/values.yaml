grafana:
  enabled: true
  defaultDashboardsEnabled: true
  podLabels:
    security.no-name.win/falco-reverse-shell: "true"
    security.no-name.win/falco-web-process: "false"
    security.no-name.win/falco-unexpected-listener: "false"
    security.no-name.win/falco-payload-execution: "false"
    security.no-name.win/falco-container-escape: "true"
    security.no-name.win/falco-unexpected-root: "false"
    security.no-name.win/falco-service-account-access: "false"
  image:
    tag: 13.3.0
    sha: 488984b716c0862639f91a698adbe2862677a5a07bad42da5f03f3030883b205
  initChownData:
    image:
      tag: "1.38.0"
      sha: f97baa533a26513c453a362be331a43eb60214302f449c16571b23cea141dce4
  sidecar:
    image:
      tag: 2.14.3
      sha: 84df4f4f53bedc59e72f594f58047a1f98f8aebc4326533f0c7170b2748e6840
  admin:
    existingSecret: grafana-admin-credentials
    userKey: admin-user
    passwordKey: admin-password
  serviceMonitor:
    metricRelabelings:
      - action: drop
        sourceLabels:
          - __name__
        # These high-cardinality API-server histograms dominate Grafana's
        # scrape footprint and are not used by the bundled dashboards.
        regex: grafana_feature_toggles_info|grafana_apiserver_request_(duration|slo_duration|sli_duration)_seconds_bucket
  deploymentStrategy:
    type: Recreate
  persistence:
    enabled: true
    storageClassName: longhorn
    size: 1Gi
prometheus:
  prometheusSpec:
    image:
      tag: v3.16.0-distroless
      sha: b3e1df0b7003c8222c9f79e679b2ec9c8f993803d36839d7f139eef5cc64119b
    retention: 12h
    # This limits persisted blocks only. WAL, head chunks, and temporary
    # compaction files are additional, so keep substantial PVC headroom.
    retentionSize: 300MB
    scrapeInterval: 60s
    evaluationInterval: 60s
    serviceMonitorSelectorNilUsesHelmValues: false
    podMonitorSelectorNilUsesHelmValues: false
    storageSpec:
      volumeClaimTemplate:
        metadata:
          labels:
            # PVC labels are the source of the Prometheus-only Longhorn jobs.
            recurring-job.longhorn.io/source: enabled
            recurring-job.longhorn.io/prometheus-daily-snapshot: enabled
            recurring-job.longhorn.io/prometheus-daily-snapshot-delete: enabled
            recurring-job.longhorn.io/prometheus-daily-trim: enabled
        spec:
          storageClassName: longhorn
          accessModes:
            - ReadWriteOnce
          resources:
            requests:
              storage: 1536Mi
alertmanager:
  alertmanagerSpec:
    image:
      tag: v0.34.1
      sha: 84967b9b7ba45e38a9278d3e594305f43d4993c310df3905b51138b816c365f3
    retention: 12h
    # Select only centrally managed AlertmanagerConfig resources from the
    # monitoring namespace. The route itself limits delivery to team=security.
    alertmanagerConfigSelector:
      matchLabels:
        alertmanager-config: enabled
    alertmanagerConfigNamespaceSelector:
      matchLabels:
        kubernetes.io/metadata.name: monitoring
    # Security rules live in several namespaces (for example, Cilium rules are
    # in kube-system), so do not inject a monitoring namespace matcher.
    alertmanagerConfigMatcherStrategy:
      type: None

prometheus-node-exporter:
  image:
    tag: v1.12.1
    digest: sha256:bbfbd533202cfef891c70383ddf6f0c32acece66400ad8091a18bed7aad5db6f
  daemonsetAnnotations:
    argocd.argoproj.io/ignore-healthcheck: "true"

kube-state-metrics:
  image:
    tag: v2.20.0
    sha: sha256:01171220c7c059afc85034ffe687bfe7249e41c0cc46fbe9a5128503ceee3016

prometheusOperator:
  image:
    tag: v0.94.1
    sha: ee7157809d227e2f9c112b329a9732bca4eb65d4df157ce83111f4debe4646fd
  prometheusConfigReloader:
    image:
      tag: v0.94.1
      sha: ac2f46e50daebc6163d2ba17adbbbc7fe8f51a0000e7961e821dcb9331b3702f
  thanosImage:
    tag: v0.42.4
    sha: ce7e48cbbaec82cb3b4eb1c348f90de92976edcd4148dc9a0f1394cc43e09422
  admissionWebhooks:
    patch:
      image:
        tag: 1.11.0
        sha: 471e50747c483f111056c35a77176b52bbd3dcf58c55bcbd8cb79c0e8a92a23d

kubeApiServer:
  serviceMonitor:
    metricRelabelings:
      # Preserve the chart's default bucket reduction rule.
      - action: drop
        regex: (etcd_request|apiserver_request_slo|apiserver_request_sli|apiserver_request)_duration_seconds_bucket;(0\.15|0\.2|0\.3|0\.35|0\.4|0\.45|0\.6|0\.7|0\.8|0\.9|1\.25|1\.5|1\.75|2|3|3\.5|4|4\.5|6|7|8|9|15|20|40|45|50)(\.0)?
        sourceLabels:
          - __name__
          - le
      - action: drop
        sourceLabels:
          - __name__
        regex: apiserver_request_body_size_bytes_bucket|apiserver_response_sizes_bucket|apiserver_watch_list_duration_seconds_bucket|apiserver_watch_cache_read_wait_seconds_bucket|etcd_request_duration_seconds_bucket

kubelet:
  serviceMonitor:
    interval: 60s
    probesMetricRelabelings:
      - action: drop
        sourceLabels:
          - __name__
        regex: prober_probe_duration_seconds_bucket
