# Keep the policy engine observable but non-disruptive during the initial rollout.
# The kyverno-api subchart otherwise renders `metadata.labels: {}` on its
# CRDs. Kubernetes removes that empty map, causing permanent Argo CD drift.
kyverno-api:
  labels:
    app.kubernetes.io/managed-by: Helm

# Pin every Kyverno image rendered by chart 3.9.2. The chart does not expose a
# separate digest field, so its tag values contain the immutable digest.
crds:
  migration:
    image:
      tag: v1.19.2@sha256:10ea8e2cea5d05bbf17784a5e51a3a983fdbfa808cd7980b919264507e95fbdf

features:
  forceFailurePolicyIgnore:
    enabled: true
  backgroundScan:
    enabled: true
    backgroundScanInterval: 1h
  reporting:
    validate: true
    imageVerify: true
    mutate: false
    mutateExisting: false
    generate: false
  generateValidatingAdmissionPolicy:
    enabled: false

# Emit policy findings through the forward-looking OpenReports API. DefectDojo
# can ingest this format without a custom findings parser.
openreports:
  enabled: true
  installCrds: true

config:
  # Do not rewrite unqualified image references during this audit-only phase.
  enableDefaultRegistryMutation: false

admissionController:
  replicas: 1
  initContainer:
    image:
      tag: v1.19.2@sha256:380c58effb6f065d4e856c084564482930eef789f47fab9dafa68a1964139a81
  container:
    image:
      tag: v1.19.2@sha256:6f0c520054d863a4a3df53ac7bb67d571d20421b77b99809013a62ec5f1d5947
    resources:
      requests:
        cpu: 50m
        memory: 128Mi
      limits:
        cpu: 500m
        memory: 384Mi
  serviceMonitor:
    enabled: true
    namespace: monitoring
    interval: 60s

backgroundController:
  replicas: 1
  image:
    tag: v1.19.2@sha256:7643ae5d759ae45f5c6035c62d9db4de6b325e513e36d43cfe47f3bc95dadac7
  resources:
    requests:
      cpu: 25m
      memory: 64Mi
    limits:
      cpu: 250m
      memory: 192Mi
  serviceMonitor:
    enabled: true
    namespace: monitoring
    interval: 60s

# No cleanup policies are installed, so this controller is unnecessary.
cleanupController:
  enabled: false

reportsController:
  replicas: 1
  image:
    tag: v1.19.2@sha256:9fbfa8cce7008bc45be75b2f6c4bf40e5ff582466fe571c1a38733a16a2bb510
  resources:
    requests:
      cpu: 25m
      memory: 64Mi
    limits:
      cpu: 250m
      memory: 192Mi
  serviceMonitor:
    enabled: true
    namespace: monitoring
    interval: 60s

grafana:
  enabled: false
