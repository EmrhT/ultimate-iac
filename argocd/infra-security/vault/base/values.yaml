global:
  enabled: true
injector:
  enabled: true
  image:
    repository: docker.io/hashicorp/vault-k8s
    tag: 1.7.2@sha256:ae3d307658b72a1cf35dab9bdf92c995d45cdc7183af0516857714b5bd0ba84d
  agentImage:
    repository: docker.io/hashicorp/vault
    tag: 1.21.2@sha256:eb0ba6836e8d4699b7a1e8ca70d8433f7b87dcd067e6d82dff237d3ed2600ea0
server:
  image:
    repository: docker.io/hashicorp/vault
    tag: 1.21.2@sha256:eb0ba6836e8d4699b7a1e8ca70d8433f7b87dcd067e6d82dff237d3ed2600ea0
  dev:
    enabled: false
  standalone:
    enabled: true
    config: |
      ui = true
      disable_mlock = true

      api_addr = "http://POD_IP:8200"
      cluster_addr = "http://HOSTNAME.vault-internal:8201"

      listener "tcp" {
        address = "[::]:8200"
        cluster_address = "[::]:8201"
        tls_disable = 1
      }

      storage "raft" {
        path = "/vault/data/raft"
        node_id = "HOSTNAME"
      }
  ha:
    enabled: false
    clusterAddr: http://vault-0.vault-internal:8201
  dataStorage:
    enabled: true
    storageClass: longhorn
    size: 500Mi
    labels:
      recurring-job.longhorn.io/source: enabled
      recurring-job.longhorn.io/vault-daily-snapshot: enabled
  auditStorage:
    enabled: false
ui:
  enabled: true
  serviceType: ClusterIP
