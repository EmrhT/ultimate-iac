global:
  enabled: true
injector:
  enabled: true
server:
  dev:
    enabled: false
  standalone:
    enabled: true
    config: |
      ui = true
      disable_mlock = true

      listener "tcp" {
        address = "[::]:8200"
        cluster_address = "[::]:8201"
        tls_disable = 1
      }

      storage "file" {
        path = "/vault/data"
      }
  ha:
    enabled: false
  dataStorage:
    enabled: true
    storageClass: longhorn
    size: 1Gi
  auditStorage:
    enabled: false
ui:
  enabled: true
  serviceType: ClusterIP

