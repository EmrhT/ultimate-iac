apiVersion: kibana.k8s.elastic.co/v1
kind: Kibana
metadata:
  name: platform
spec:
  version: 9.5.7
  image: docker.elastic.co/kibana/kibana@sha256:19a45a3ef66233e8d4bbace6dc8dc13ef7655b7ec40e2bbe91b3f68e81cf0d84
  count: 1
  elasticsearchRef:
    name: platform
  http:
    tls:
      selfSignedCertificate:
        disabled: true
  podTemplate:
    spec:
      serviceAccountName: platform-kibana
      automountServiceAccountToken: false
      containers:
        - name: kibana
          resources:
            requests:
              cpu: 200m
              memory: 512Mi
            limits:
              memory: 1Gi
