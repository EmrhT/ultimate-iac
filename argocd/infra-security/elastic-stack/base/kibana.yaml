apiVersion: kibana.k8s.elastic.co/v1
kind: Kibana
metadata:
  name: platform
spec:
  version: 9.4.9
  image: docker.elastic.co/kibana/kibana@sha256:7dfe90696ca9b6efd7af52a50d06dba8ea16784615d76dd2a2fd47ff19c816d0
  count: 1
  elasticsearchRef:
    name: platform
  http:
    tls:
      selfSignedCertificate:
        disabled: true
  podTemplate:
    spec:
      serviceAccountName: platform-kibana
      automountServiceAccountToken: false
      containers:
        - name: kibana
          resources:
            requests:
              cpu: 200m
              memory: 512Mi
            limits:
              memory: 1Gi
