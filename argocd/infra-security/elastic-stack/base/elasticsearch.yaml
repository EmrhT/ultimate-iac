apiVersion: elasticsearch.k8s.elastic.co/v1
kind: Elasticsearch
metadata:
  name: platform
spec:
  version: 9.4.9
  image: docker.elastic.co/elasticsearch/elasticsearch@sha256:0a95b0fb35f3084f5336ec18f9de4469d564fe863c87218916a90ff85cf1f170
  nodeSets:
    - name: default
      count: 1
      config:
        node.store.allow_mmap: false
      podTemplate:
        spec:
          serviceAccountName: platform-elasticsearch
          automountServiceAccountToken: false
          containers:
            - name: elasticsearch
              resources:
                requests:
                  cpu: 500m
                  memory: 1Gi
                limits:
                  memory: 2Gi
      volumeClaimTemplates:
        - metadata:
            name: elasticsearch-data
          spec:
            accessModes:
              - ReadWriteOnce
            storageClassName: longhorn
            resources:
              requests:
                storage: 1Gi
