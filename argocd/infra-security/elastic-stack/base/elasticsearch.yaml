apiVersion: elasticsearch.k8s.elastic.co/v1
kind: Elasticsearch
metadata:
  name: platform
spec:
  version: 9.5.7
  image: docker.elastic.co/elasticsearch/elasticsearch@sha256:b1afeff2d9675608c0a02c08af0086b2fba24a50a24f199d5be896403bce591e
  nodeSets:
    - name: default
      count: 1
      config:
        node.store.allow_mmap: false
      podTemplate:
        spec:
          serviceAccountName: platform-elasticsearch
          automountServiceAccountToken: false
          containers:
            - name: elasticsearch
              resources:
                requests:
                  cpu: 500m
                  memory: 1Gi
                limits:
                  memory: 2Gi
      volumeClaimTemplates:
        - metadata:
            name: elasticsearch-data
          spec:
            accessModes:
              - ReadWriteOnce
            storageClassName: longhorn
            resources:
              requests:
                storage: 1Gi
