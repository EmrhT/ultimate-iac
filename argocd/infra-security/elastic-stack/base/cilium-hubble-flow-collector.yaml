apiVersion: v1
kind: ServiceAccount
metadata:
  name: cilium-hubble-flow-collector
automountServiceAccountToken: false
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: cilium-hubble-flow-collector
data:
  config.yaml: |-
    extensions:
      file_storage:
        directory: /var/lib/otelcol
        create_directory: true
      health_check:
        endpoint: 0.0.0.0:13133

    receivers:
      # Every Cilium agent writes only DROPPED and ERROR Hubble flows to this
      # node-local, size-bounded file. Follow rotations without replaying old
      # records when this collector is installed for the first time.
      filelog/cilium_hubble:
        include:
          - /var/run/cilium/hubble/security-events.log*
        start_at: end
        storage: file_storage
        operators:
          - type: json_parser
            parse_from: body
            parse_to: body

    processors:
      memory_limiter:
        check_interval: 1s
        limit_mib: 64
        spike_limit_mib: 16

      transform/cilium_hubble:
        error_mode: ignore
        log_statements:
          - context: scope
            statements:
              - set(attributes["elastic.mapping.mode"], "bodymap")
          - context: log
            statements:
              - set(attributes["event.dataset"], "cilium.hubble")
              - set(body["event"], ParseJSON("{\"dataset\":\"cilium.hubble\"}")) where body["event"] == nil
              - set(body["event"]["dataset"], "cilium.hubble")
              - set(body["ingested_at"], FormatTime(observed_time, "%Y-%m-%dT%H:%M:%S.%sZ"))

      batch/cilium_hubble:
        timeout: 2s
        send_batch_size: 128
        send_batch_max_size: 256

    exporters:
      elasticsearch/cilium_hubble:
        endpoint: https://platform-es-http.elastic-stack.svc:9200
        user: elastic
        password: ${env:ELASTIC_PASSWORD}
        tls:
          ca_file: /etc/elasticsearch/certs/ca.crt
        logs_index: cilium-hubble-write
        compression: gzip
        sending_queue:
          enabled: true
          queue_size: 256

    service:
      extensions:
        - file_storage
        - health_check
      telemetry:
        logs:
          level: info
      pipelines:
        logs/cilium_hubble:
          receivers:
            - filelog/cilium_hubble
          processors:
            - memory_limiter
            - transform/cilium_hubble
            - batch/cilium_hubble
          exporters:
            - elasticsearch/cilium_hubble
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: cilium-hubble-flow-collector
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: cilium-hubble-flow-collector
  template:
    metadata:
      labels:
        app.kubernetes.io/name: cilium-hubble-flow-collector
    spec:
      serviceAccountName: cilium-hubble-flow-collector
      automountServiceAccountToken: false
      tolerations:
        - key: node-role.kubernetes.io/control-plane
          operator: Exists
          effect: NoSchedule
      initContainers:
        # Prevent Elasticsearch from auto-creating cilium-hubble-write as a
        # concrete index before the bootstrapper establishes it as an alias.
        - name: wait-for-index-alias
          image: docker.io/curlimages/curl@sha256:7c12af72ceb38b7432ab85e1a265cff6ae58e06f95539d539b654f2cfa64bb13
          command:
            - /bin/sh
            - -ec
            - |-
              until curl --silent --fail \
                --cacert /etc/elasticsearch/certs/ca.crt \
                --user "elastic:${ELASTIC_PASSWORD}" \
                https://platform-es-http.elastic-stack.svc:9200/_alias/cilium-hubble-write \
                >/dev/null; do
                sleep 5
              done
          env:
            - name: ELASTIC_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: platform-es-elastic-user
                  key: elastic
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 100
            runAsGroup: 101
            seccompProfile:
              type: RuntimeDefault
          resources:
            requests:
              cpu: 2m
              memory: 4Mi
            limits:
              cpu: 25m
              memory: 16Mi
          volumeMounts:
            - name: elasticsearch-ca
              mountPath: /etc/elasticsearch/certs
              readOnly: true
      containers:
        - name: otel-collector
          image: docker.io/otel/opentelemetry-collector-contrib@sha256:799dc6cf12c96192af37b5bdba804da8c10b3bc563b43cb90c3f3c58d9572ad6
          args:
            - --config=/etc/otelcol/config.yaml
          env:
            - name: ELASTIC_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: platform-es-elastic-user
                  key: elastic
          ports:
            - name: health
              containerPort: 13133
          livenessProbe:
            httpGet:
              path: /
              port: health
            initialDelaySeconds: 10
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /
              port: health
            initialDelaySeconds: 5
            periodSeconds: 10
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
            # Cilium creates the flow log as root inside /var/run/cilium.
            runAsUser: 0
            seccompProfile:
              type: RuntimeDefault
          resources:
            requests:
              cpu: 5m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 96Mi
          volumeMounts:
            - name: config
              mountPath: /etc/otelcol
              readOnly: true
            - name: cilium-hubble-events
              mountPath: /var/run/cilium/hubble
              readOnly: true
            - name: otel-data
              mountPath: /var/lib/otelcol
            - name: elasticsearch-ca
              mountPath: /etc/elasticsearch/certs
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: cilium-hubble-flow-collector
        - name: cilium-hubble-events
          hostPath:
            path: /var/run/cilium/hubble
            type: DirectoryOrCreate
        - name: otel-data
          hostPath:
            path: /var/lib/otelcol-cilium-hubble
            type: DirectoryOrCreate
        - name: elasticsearch-ca
          secret:
            secretName: platform-es-http-certs-public
            items:
              - key: ca.crt
                path: ca.crt
