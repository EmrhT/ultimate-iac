apiVersion: v1
kind: ConfigMap
metadata:
  name: security-events-otel-collector
data:
  config.yaml: |-
    extensions:
      # Persist only file offsets and exporter queue metadata. Security events
      # themselves remain in Elasticsearch under the small ILM policies below.
      file_storage:
        directory: /var/lib/otelcol
        create_directory: true
      health_check:
        endpoint: 0.0.0.0:13133

    receivers:
      # The API server writes one JSON audit event per line on the control-plane
      # host. Start at the end on first install to avoid replaying old history.
      filelog/kubernetes_audit:
        include:
          - /var/log/kubernetes/audit/kube-apiserver-audit.log
        start_at: end
        storage: file_storage
        operators:
          - type: json_parser
            parse_from: body

      # Falcosidekick sends Critical events using the standard OTLP/HTTP logs
      # protocol. Its separate Alertmanager output remains the real-time path.
      otlp/falco:
        protocols:
          http:
            endpoint: 0.0.0.0:4318

    processors:
      memory_limiter:
        check_interval: 1s
        limit_mib: 144
        spike_limit_mib: 32

      transform/kubernetes_audit:
        error_mode: ignore
        log_statements:
          - context: log
            statements:
              - set(attributes["event.dataset"], "kubernetes.audit")
              - set(body["event"], ParseJSON("{\"dataset\":\"kubernetes.audit\"}")) where body["event"] == nil
              - set(body["event"]["dataset"], "kubernetes.audit")
              - set(attributes["username"], body["user"]["username"]) where body["user"]["username"] != nil
              - set(attributes["namespace"], body["objectRef"]["namespace"]) where body["objectRef"]["namespace"] != nil
              - set(attributes["pod"], body["objectRef"]["name"]) where body["objectRef"]["name"] != nil
              - set(attributes["source_ip"], body["sourceIPs"][0]) where body["sourceIPs"] != nil
              - set(attributes["response_code"], body["responseStatus"]["code"]) where body["responseStatus"]["code"] != nil

              # Classify successful interactive exec requests. Start with the
              # unapproved default, then replace it with more specific caller
              # classes. The admin assignment is last so membership in the
              # admins group always suppresses notification.
              - set(attributes["classification"], "unapproved_identity") where body["objectRef"]["resource"] == "pods" and body["objectRef"]["subresource"] == "exec" and body["verb"] == "create" and body["stage"] == "ResponseStarted" and body["responseStatus"]["code"] < 400
              - set(attributes["classification"], "service_account") where attributes["classification"] == "unapproved_identity" and IsMatch(attributes["username"], "^system:serviceaccount:")
              - set(attributes["classification"], "developer_allowed") where attributes["classification"] != nil and IsMatch(body["user"]["groups"], "keycloak:/platform/devs")
              - set(attributes["classification"], "admin") where attributes["classification"] != nil and IsMatch(body["user"]["groups"], "keycloak:/platform/admins")

              # A denied developer exec is retained as a warning signal. Other
              # denied requests remain searchable but do not become metrics.
              - set(attributes["classification"], "developer_denied") where body["objectRef"]["resource"] == "pods" and body["objectRef"]["subresource"] == "exec" and body["verb"] == "create" and body["stage"] == "ResponseComplete" and body["responseStatus"]["code"] == 403 and IsMatch(body["user"]["groups"], "keycloak:/platform/devs")

      transform/falco:
        error_mode: ignore
        log_statements:
          - context: log
            statements:
              - set(attributes["event.dataset"], "falco")

      batch/audit:
        timeout: 2s
        send_batch_size: 256
        send_batch_max_size: 512
      batch/falco:
        timeout: 2s
        send_batch_size: 64
        send_batch_max_size: 128

    connectors:
      # Convert only alertable Kubernetes exec audit events into a counter.
      # Admin events are deliberately absent. Prometheus rules below retain the
      # existing Alertmanager and PagerDuty notification architecture.
      count/kubernetes_exec:
        logs:
          kubernetes.exec.events:
            description: Alertable Kubernetes pods/exec audit events
            conditions:
              - attributes["classification"] == "service_account"
              - attributes["classification"] == "developer_allowed"
              - attributes["classification"] == "unapproved_identity"
              - attributes["classification"] == "developer_denied"
            attributes:
              - key: classification
              - key: username
                default_value: unknown
              - key: namespace
                default_value: unknown
              - key: pod
                default_value: unknown
              - key: source_ip
                default_value: unknown
              - key: response_code
                default_value: 0

    exporters:
      elasticsearch/audit:
        endpoint: https://platform-es-http.elastic-stack.svc:9200
        user: elastic
        password: ${env:ELASTIC_PASSWORD}
        tls:
          ca_file: /etc/elasticsearch/certs/ca.crt
        logs_index: kubernetes-audit-write
        mapping:
          # Store the parsed Kubernetes audit object without an OTel envelope.
          mode: bodymap
        compression: gzip
        sending_queue:
          enabled: true
          queue_size: 500

      elasticsearch/falco:
        endpoint: https://platform-es-http.elastic-stack.svc:9200
        user: elastic
        password: ${env:ELASTIC_PASSWORD}
        tls:
          ca_file: /etc/elasticsearch/certs/ca.crt
        logs_index: falco-write
        mapping:
          mode: raw
        compression: gzip
        sending_queue:
          enabled: true
          queue_size: 100

      prometheus:
        endpoint: 0.0.0.0:8889
        namespace: security_events
        metric_expiration: 5m

    service:
      extensions:
        - file_storage
        - health_check
      telemetry:
        logs:
          level: info
      pipelines:
        logs/audit:
          receivers:
            - filelog/kubernetes_audit
          processors:
            - memory_limiter
            - transform/kubernetes_audit
            - batch/audit
          exporters:
            - elasticsearch/audit
            - count/kubernetes_exec
        logs/falco:
          receivers:
            - otlp/falco
          processors:
            - memory_limiter
            - transform/falco
            - batch/falco
          exporters:
            - elasticsearch/falco
        metrics/kubernetes_exec:
          receivers:
            - count/kubernetes_exec
          exporters:
            - prometheus

  bootstrap-indices.sh: |-
    #!/bin/sh
    set -eu

    endpoint="https://platform-es-http.elastic-stack.svc:9200"
    auth="elastic:${ELASTIC_PASSWORD}"
    ca="/etc/elasticsearch/certs/ca.crt"

    # Wait for the single-node Elasticsearch service after restarts.
    until curl --silent --fail --cacert "$ca" --user "$auth" "$endpoint/_cluster/health?wait_for_status=yellow&timeout=5s" >/dev/null; do
      sleep 5
    done

    # Both streams roll over before becoming large and are deleted after three
    # days. One primary and zero replicas are appropriate for this 1 GiB lab.
    for stream in kubernetes-audit falco; do
      curl --silent --fail --cacert "$ca" --user "$auth" \
        --request PUT "$endpoint/_ilm/policy/${stream}-small" \
        --header 'Content-Type: application/json' \
        --data '{"policy":{"phases":{"hot":{"actions":{"rollover":{"max_primary_shard_size":"25mb","max_age":"1d"}}},"delete":{"min_age":"3d","actions":{"delete":{}}}}}}' >/dev/null

      curl --silent --fail --cacert "$ca" --user "$auth" \
        --request PUT "$endpoint/_index_template/${stream}-small" \
        --header 'Content-Type: application/json' \
        --data "{\"index_patterns\":[\"${stream}-*\"],\"template\":{\"settings\":{\"index.lifecycle.name\":\"${stream}-small\",\"index.lifecycle.rollover_alias\":\"${stream}-write\",\"number_of_shards\":1,\"number_of_replicas\":0,\"refresh_interval\":\"30s\"}}}" >/dev/null

      if ! curl --silent --fail --cacert "$ca" --user "$auth" "$endpoint/_alias/${stream}-write" >/dev/null; then
        curl --silent --fail --cacert "$ca" --user "$auth" \
          --request PUT "$endpoint/${stream}-000001" \
          --header 'Content-Type: application/json' \
          --data "{\"aliases\":{\"${stream}-write\":{\"is_write_index\":true}}}" >/dev/null
      fi
    done
---
apiVersion: v1
kind: Service
metadata:
  name: security-events-otel-collector
  labels:
    app.kubernetes.io/name: security-events-otel-collector
spec:
  selector:
    app.kubernetes.io/name: security-events-otel-collector
  ports:
    - name: otlp-http
      port: 4318
      targetPort: otlp-http
    - name: prometheus
      port: 8889
      targetPort: prometheus
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: security-events-otel-collector
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: security-events-otel-collector
  template:
    metadata:
      labels:
        app.kubernetes.io/name: security-events-otel-collector
    spec:
      serviceAccountName: security-events-otel-collector
      automountServiceAccountToken: false
      nodeSelector:
        node-role.kubernetes.io/control-plane: ""
      tolerations:
        - key: node-role.kubernetes.io/control-plane
          operator: Exists
          effect: NoSchedule
      initContainers:
        - name: bootstrap-indices
          image: curlimages/curl:8.21.0
          command:
            - /bin/sh
            - /etc/otelcol/bootstrap-indices.sh
          env:
            - name: ELASTIC_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: platform-es-elastic-user
                  key: elastic
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 100
            runAsGroup: 101
            seccompProfile:
              type: RuntimeDefault
          resources:
            requests:
              cpu: 5m
              memory: 8Mi
            limits:
              cpu: 50m
              memory: 32Mi
          volumeMounts:
            - name: config
              mountPath: /etc/otelcol
              readOnly: true
            - name: elasticsearch-ca
              mountPath: /etc/elasticsearch/certs
              readOnly: true
      containers:
        - name: otel-collector
          image: otel/opentelemetry-collector-contrib:0.160.0
          args:
            - --config=/etc/otelcol/config.yaml
          env:
            - name: ELASTIC_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: platform-es-elastic-user
                  key: elastic
          ports:
            - name: otlp-http
              containerPort: 4318
            - name: prometheus
              containerPort: 8889
            - name: health
              containerPort: 13133
          livenessProbe:
            httpGet:
              path: /
              port: health
            initialDelaySeconds: 10
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /
              port: health
            initialDelaySeconds: 5
            periodSeconds: 10
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
            # The API server audit file is root-owned and mode 0600.
            runAsUser: 0
            seccompProfile:
              type: RuntimeDefault
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 192Mi
          volumeMounts:
            - name: config
              mountPath: /etc/otelcol
              readOnly: true
            - name: kubernetes-audit
              mountPath: /var/log/kubernetes/audit
              readOnly: true
            - name: otel-data
              mountPath: /var/lib/otelcol
            - name: elasticsearch-ca
              mountPath: /etc/elasticsearch/certs
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: security-events-otel-collector
            defaultMode: 0555
        - name: kubernetes-audit
          hostPath:
            path: /var/log/kubernetes/audit
            type: Directory
        - name: otel-data
          hostPath:
            path: /var/lib/otelcol-security-events
            type: DirectoryOrCreate
        - name: elasticsearch-ca
          secret:
            secretName: platform-es-http-certs-public
            items:
              - key: ca.crt
                path: ca.crt
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: security-events-otel-collector
  labels:
    release: kube-prometheus-stack
spec:
  namespaceSelector:
    matchNames:
      - elastic-stack
  selector:
    matchLabels:
      app.kubernetes.io/name: security-events-otel-collector
  endpoints:
    - port: prometheus
      interval: 15s
---
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: kubernetes-exec-security-alerts
  labels:
    release: kube-prometheus-stack
spec:
  groups:
    - name: kubernetes.audit-exec-security
      interval: 15s
      rules:
        - alert: KubernetesServiceAccountExec
          expr: increase(security_events_kubernetes_exec_events_total{classification="service_account"}[2m]) > 0
          labels:
            severity: critical
            team: security
            detector: kubernetes-audit
          annotations:
            summary: A Kubernetes service account opened a shell in a pod
            description: >-
              Identity {{ $labels.username }} opened an exec session in
              {{ $labels.namespace }}/{{ $labels.pod }} from {{ $labels.source_ip }}.
            runbook_url: https://kibana.no-name.win

        - alert: KubernetesDeveloperExecAllowed
          expr: increase(security_events_kubernetes_exec_events_total{classification="developer_allowed"}[2m]) > 0
          labels:
            severity: critical
            team: security
            detector: kubernetes-audit
          annotations:
            summary: A Keycloak developer was unexpectedly allowed to exec into a pod
            description: >-
              Identity {{ $labels.username }} opened an exec session in
              {{ $labels.namespace }}/{{ $labels.pod }} from {{ $labels.source_ip }}.
            runbook_url: https://kibana.no-name.win

        - alert: KubernetesUnapprovedIdentityExec
          expr: increase(security_events_kubernetes_exec_events_total{classification="unapproved_identity"}[2m]) > 0
          labels:
            severity: critical
            team: security
            detector: kubernetes-audit
          annotations:
            summary: An unapproved Kubernetes identity opened a shell in a pod
            description: >-
              Identity {{ $labels.username }} opened an exec session in
              {{ $labels.namespace }}/{{ $labels.pod }} from {{ $labels.source_ip }}.
            runbook_url: https://kibana.no-name.win

        - alert: KubernetesDeveloperExecDenied
          expr: increase(security_events_kubernetes_exec_events_total{classification="developer_denied"}[2m]) > 0
          labels:
            severity: warning
            team: security
            detector: kubernetes-audit
          annotations:
            summary: Kubernetes denied a developer attempt to exec into a pod
            description: >-
              Identity {{ $labels.username }} was denied an exec session in
              {{ $labels.namespace }}/{{ $labels.pod }} from {{ $labels.source_ip }}.
            runbook_url: https://kibana.no-name.win
