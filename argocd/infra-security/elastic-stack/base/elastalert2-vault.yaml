apiVersion: v1
kind: ServiceAccount
metadata:
  # The existing Vault vso-admin role authorizes this conventional name.
  name: vault-auth
  annotations:
    argocd.argoproj.io/sync-wave: "-30"
automountServiceAccountToken: false
---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultAuth
metadata:
  name: elastalert2
  annotations:
    argocd.argoproj.io/sync-wave: "-29"
spec:
  vaultConnectionRef: vault-secrets-operator/default
  method: kubernetes
  mount: kubernetes
  kubernetes:
    role: vso-admin
    serviceAccount: vault-auth
    audiences:
      - vault
---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: elastalert2-config
  annotations:
    argocd.argoproj.io/sync-wave: "-28"
spec:
  vaultAuthRef: elastalert2
  mount: kv
  type: kv-v2
  path: infra/monitoring/pagerduty
  refreshAfter: 1m
  hmacSecretData: true
  destination:
    create: true
    overwrite: true
    name: elastalert2-config
    type: Opaque
    transformation:
      # The PagerDuty routing key is rendered into ElastAlert2's runtime-only
      # configuration. Neither the key nor a base64 form of it is stored in Git.
      excludeRaw: true
      excludes:
        - '.*'
      templates:
        elastalert_config:
          text: |-
            rules_folder: /opt/elastalert/rules
            scan_subdirectories: true
            run_every:
              seconds: 15
            buffer_time:
              minutes: 1
            es_host: platform-es-http.elastic-stack.svc
            es_port: 9200
            es_username: elastic
            writeback_index: elastalert2
            use_ssl: true
            verify_certs: true
            ca_certs: /certs/ca.crt
            alert_time_limit:
              minutes: 60
            pagerduty_routing_key: '{{ get .Secrets "elastalert2-routing-key" }}'
