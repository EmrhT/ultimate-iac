replicaCount: 1
runIntervalMins: 1
bufferTimeMins: 1
writebackIndex: elastalert2

# VSO creates this Secret from Vault. It contains the normal ElastAlert2
# configuration plus the PagerDuty Events API v2 routing key.
secretConfigName: elastalert2-config

elasticsearch:
  host: platform-es-http.elastic-stack.svc
  port: 9200
  useSsl: "True"
  verifyCerts: "True"
  caCerts: /certs/ca.crt
  credentialsSecret: platform-es-elastic-user
  credentialsSecretPasswordKey: elastic
  certsVolumes:
    - name: elasticsearch-ca
      secret:
        secretName: platform-es-http-certs-public
        items:
          - key: ca.crt
            path: ca.crt
  certsVolumeMounts:
    - name: elasticsearch-ca
      mountPath: /certs
      readOnly: true

serviceAccount:
  create: false
  name: elastalert2

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  runAsGroup: 1000
  fsGroup: 1000
  seccompProfile:
    type: RuntimeDefault

securityContext:
  runAsNonRoot: true
  runAsUser: 1000
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL

resources:
  requests:
    cpu: 20m
    memory: 64Mi
  limits:
    cpu: 150m
    memory: 192Mi

metrics:
  enabled: false

image:
  repository: docker.io/jertel/elastalert2
  tag: 2.31.0@sha256:3cbf63f9b7dc09d416e6985b948d9d9095e7d793e7bebe0eb9d207682e8548ac

rules:
  kubernetes_non_admin_interactive_pod_access: |-
    name: Kubernetes non-admin interactive pod access
    type: any
    index: kubernetes-audit-*
    # Evaluate when the API server observed the completed authorization and
    # protocol upgrade, not when a collector happened to ingest the record.
    timestamp_field: stageTimestamp
    filter:
      - terms:
          classification.keyword:
            - service_account
            - developer_allowed
            - unapproved_identity
    realert:
      minutes: 1
    include_rule_params_in_matches:
      - pagerduty_routing_key
    alert:
      - post2
    http_post2_url: https://events.eu.pagerduty.com/v2/enqueue
    http_post2_all_values: false
    http_post2_payload: |-
      {
        "routing_key": "{{ rule_param_pagerduty_routing_key }}",
        "event_action": "trigger",
        "dedup_key": "kubernetes-interactive-access-{{ auditID }}",
        "payload": {
          "summary": "Non-admin identity {{ user.username }} used pods/{{ objectRef.subresource }}",
          "source": "ultimate-iac-kubernetes",
          "severity": "critical",
          "component": "kube-apiserver-audit",
          "group": "security-runtime",
          "class": "interactive-pod-access",
          "custom_details": {
            "classification": "{{ classification }}",
            "username": "{{ user.username }}",
            "namespace": "{{ objectRef.namespace }}",
            "pod": "{{ objectRef.name }}",
            "subresource": "{{ objectRef.subresource }}",
            "verb": "{{ verb }}",
            "source_ips": "{{ sourceIPs }}"
          }
        }
      }

  kubernetes_developer_interactive_access_denied: |-
    name: Kubernetes denied developer interactive pod access
    type: any
    index: kubernetes-audit-*
    timestamp_field: stageTimestamp
    filter:
      - term:
          classification.keyword: developer_denied
    realert:
      minutes: 1
    include_rule_params_in_matches:
      - pagerduty_routing_key
    alert:
      - post2
    http_post2_url: https://events.eu.pagerduty.com/v2/enqueue
    http_post2_all_values: false
    http_post2_payload: |-
      {
        "routing_key": "{{ rule_param_pagerduty_routing_key }}",
        "event_action": "trigger",
        "dedup_key": "kubernetes-denied-interactive-access-{{ auditID }}",
        "payload": {
          "summary": "Kubernetes denied {{ user.username }} access to pods/{{ objectRef.subresource }}",
          "source": "ultimate-iac-kubernetes",
          "severity": "warning",
          "component": "kube-apiserver-audit",
          "group": "security-runtime",
          "class": "denied-interactive-pod-access",
          "custom_details": {
            "username": "{{ user.username }}",
            "namespace": "{{ objectRef.namespace }}",
            "pod": "{{ objectRef.name }}",
            "subresource": "{{ objectRef.subresource }}",
            "verb": "{{ verb }}",
            "source_ips": "{{ sourceIPs }}"
          }
        }
      }

  kubernetes_unapproved_rbac_write: |-
    name: Kubernetes unapproved RBAC write
    type: any
    index: kubernetes-audit-*
    timestamp_field: stageTimestamp
    filter:
      - term:
          classification.keyword: rbac_unapproved_success
    realert:
      minutes: 1
    include_rule_params_in_matches:
      - pagerduty_routing_key
    alert:
      - post2
    http_post2_url: https://events.eu.pagerduty.com/v2/enqueue
    http_post2_all_values: false
    http_post2_payload: |-
      {
        "routing_key": "{{ rule_param_pagerduty_routing_key }}",
        "event_action": "trigger",
        "dedup_key": "kubernetes-rbac-write-{{ auditID }}",
        "payload": {
          "summary": "Unapproved identity {{ user.username }} changed Kubernetes RBAC",
          "source": "ultimate-iac-kubernetes",
          "severity": "critical",
          "component": "kube-apiserver-audit",
          "group": "security-authorization",
          "class": "unapproved-rbac-write",
          "custom_details": {
            "username": "{{ user.username }}",
            "verb": "{{ verb }}",
            "resource": "{{ objectRef.resource }}",
            "namespace": "{{ objectRef.namespace }}",
            "object": "{{ objectRef.name }}",
            "response_code": "{{ responseStatus.code }}",
            "source_ips": "{{ sourceIPs }}"
          }
        }
      }

  kubernetes_unapproved_rbac_write_denied: |-
    name: Kubernetes denied unapproved RBAC write
    type: any
    index: kubernetes-audit-*
    timestamp_field: stageTimestamp
    filter:
      - term:
          classification.keyword: rbac_unapproved_denied
    realert:
      minutes: 1
    include_rule_params_in_matches:
      - pagerduty_routing_key
    alert:
      - post2
    http_post2_url: https://events.eu.pagerduty.com/v2/enqueue
    http_post2_all_values: false
    http_post2_payload: |-
      {
        "routing_key": "{{ rule_param_pagerduty_routing_key }}",
        "event_action": "trigger",
        "dedup_key": "kubernetes-denied-rbac-write-{{ auditID }}",
        "payload": {
          "summary": "Kubernetes denied an RBAC write by {{ user.username }}",
          "source": "ultimate-iac-kubernetes",
          "severity": "warning",
          "component": "kube-apiserver-audit",
          "group": "security-authorization",
          "class": "denied-rbac-write",
          "custom_details": {
            "username": "{{ user.username }}",
            "verb": "{{ verb }}",
            "resource": "{{ objectRef.resource }}",
            "namespace": "{{ objectRef.namespace }}",
            "object": "{{ objectRef.name }}",
            "response_code": "{{ responseStatus.code }}",
            "source_ips": "{{ sourceIPs }}"
          }
        }
      }

  kubernetes_high_risk_rbac_grant: |-
    name: Kubernetes high-risk RBAC grant
    type: any
    index: kubernetes-audit-*
    timestamp_field: stageTimestamp
    filter:
      - term:
          classification.keyword: rbac_high_risk_grant
    realert:
      minutes: 1
    include_rule_params_in_matches:
      - pagerduty_routing_key
    alert:
      - post2
    http_post2_url: https://events.eu.pagerduty.com/v2/enqueue
    http_post2_all_values: false
    http_post2_payload: |-
      {
        "routing_key": "{{ rule_param_pagerduty_routing_key }}",
        "event_action": "trigger",
        "dedup_key": "kubernetes-high-risk-rbac-{{ auditID }}",
        "payload": {
          "summary": "High-risk Kubernetes RBAC grant by {{ user.username }}",
          "source": "ultimate-iac-kubernetes",
          "severity": "critical",
          "component": "kube-apiserver-audit",
          "group": "security-authorization",
          "class": "high-risk-rbac-grant",
          "custom_details": {
            "username": "{{ user.username }}",
            "risk": "{{ rbac_risk }}",
            "verb": "{{ verb }}",
            "resource": "{{ objectRef.resource }}",
            "namespace": "{{ objectRef.namespace }}",
            "object": "{{ objectRef.name }}",
            "source_ips": "{{ sourceIPs }}"
          }
        }
      }

  falco_critical_runtime_event: |-
    name: Falco critical runtime event
    type: any
    index: falco-*
    timestamp_field: time
    filter:
      - term:
          priority.keyword: Critical
      # Page only for the deliberately designed label-enabled detections. An
      # unrelated built-in Falco rule becoming Critical must not page this
      # application's responders without an explicit review. The two built-in
      # rules below are narrowly scoped, high-confidence escape and fileless
      # execution signals that have been explicitly reviewed for this cluster.
      - terms:
          rule.keyword:
            - Reverse Shell
            - Web-Originated Process Execution
            - Unexpected Network Listener
            - Payload Execution
            - Container Escape Behavior
            - Unexpected Root Process
            - Service Account Credential Access
            - Detect release_agent File Container Escapes
            - Fileless execution via memfd_create
    realert:
      minutes: 1
    include_rule_params_in_matches:
      - pagerduty_routing_key
    alert:
      - post2
    http_post2_url: https://events.eu.pagerduty.com/v2/enqueue
    http_post2_all_values: false
    http_post2_payload: |-
      {
        "routing_key": "{{ rule_param_pagerduty_routing_key }}",
        "event_action": "trigger",
        "dedup_key": "falco-{{ rule }}-{{ _data['output_fields']['container.id'] }}",
        "payload": {
          "summary": "Falco: {{ rule }}",
          "source": "{{ hostname }}",
          "severity": "critical",
          "component": "falco",
          "group": "security-runtime",
          "class": "runtime-threat",
          "custom_details": {
            "namespace": "{{ _data['output_fields']['k8s.ns.name'] }}",
            "pod": "{{ _data['output_fields']['k8s.pod.name'] }}",
            "process": "{{ _data['output_fields']['proc.name'] }}",
            "command": "{{ _data['output_fields']['proc.cmdline'] }}",
            "event": "{{ output }}"
          }
        }
      }

  falco_talon_quarantine_succeeded: |-
    name: Falco Talon quarantined a workload
    type: any
    index: falco-talon-*
    timestamp_field: ingested_at
    # This is the completed response action, not the original Falco detection
    # and not a later Cilium drop. It pages only after Talon successfully
    # applies the transient label consumed by the quarantine policy.
    filter:
      - term:
          status.keyword: success
      - term:
          action.keyword: Quarantine Pod
      - term:
          actionner.keyword: kubernetes:label
      - terms:
          rule.keyword:
            - Quarantine Podinfo after critical runtime detection in lab-a-dev
            - Quarantine Podinfo after critical runtime detection in lab-a-prod
            - Quarantine Podinfo after critical runtime detection in lab-b-dev
            - Quarantine Podinfo after critical runtime detection in lab-b-prod
    realert:
      minutes: 1
    include_rule_params_in_matches:
      - pagerduty_routing_key
    alert:
      - post2
    http_post2_url: https://events.eu.pagerduty.com/v2/enqueue
    http_post2_all_values: false
    http_post2_payload: |-
      {
        "routing_key": "{{ rule_param_pagerduty_routing_key }}",
        "event_action": "trigger",
        "dedup_key": "falco-talon-quarantine-{{ trace_id }}",
        "payload": {
          "summary": "Falco Talon quarantined {{ _data['objects']['Namespace'] }}/{{ _data['objects']['Pod'] }}",
          "source": "falco-talon",
          "severity": "critical",
          "component": "falco-talon",
          "group": "security-runtime",
          "class": "automated-workload-quarantine",
          "custom_details": {
            "talon_rule": "{{ rule }}",
            "action": "{{ action }}",
            "namespace": "{{ _data['objects']['Namespace'] }}",
            "pod": "{{ _data['objects']['Pod'] }}",
            "originating_event": "{{ event }}",
            "trace_id": "{{ trace_id }}"
          }
        }
      }
  kyverno_unsafe_image_source: |-
    name: Kyverno unsafe image source violation
    type: any
    index: kyverno-*
    # Page only for admission-time Pods using an unapproved repository, the
    # mutable latest tag, or an image that is not pinned by digest. The Kyverno
    # policy handles the reviewed namespace-and-version exceptions before an
    # admission violation reaches this rule.
    timestamp_field: eventTime
    filter:
      - query:
          query_string:
            query: 'event.dataset:"kyverno.policy_event" AND reason:"PolicyViolation" AND reportingComponent:"kyverno-admission" AND involvedObject.kind.keyword:"Pod" AND (message:"policy require-safe-image-references/ fail: Images should use a fully qualified repository in an approved publisher namespace or an explicitly approved repository." OR message:"policy require-safe-image-references/ fail: Images should not use the mutable latest tag." OR message:"policy require-safe-image-references/ fail: Images should be pinned by an immutable sha256 digest.")'
    realert:
      minutes: 1
    include_rule_params_in_matches:
      - pagerduty_routing_key
    alert:
      - post2
    http_post2_url: https://events.eu.pagerduty.com/v2/enqueue
    http_post2_all_values: false
    http_post2_payload: |-
      {
        "routing_key": "{{ rule_param_pagerduty_routing_key }}",
        "event_action": "trigger",
        "dedup_key": "kyverno-unsafe-image-{{ involvedObject.uid }}",
        "payload": {
          "summary": "Kyverno observed an unsafe or unpinned image reference",
          "source": "ultimate-iac-kyverno",
          "severity": "critical",
          "component": "kyverno",
          "group": "security-admission",
          "class": "unsafe-image-reference",
          "custom_details": {
            "event": "{{ metadata.name }}",
            "namespace": "{{ involvedObject.namespace }}",
            "workload_kind": "{{ involvedObject.kind }}",
            "workload": "{{ involvedObject.name }}",
            "policy": "require-safe-image-references",
            "violation": "{{ message }}"
          }
        }
      }

  kyverno_explicit_uid_zero: |-
    name: Kyverno explicit UID zero violation
    type: any
    index: kyverno-*
    # Use the original Kubernetes Event time so collector restarts and event
    # replays cannot turn an old violation into a new PagerDuty alert.
    timestamp_field: eventTime
    filter:
      - query:
          query_string:
            # Page only for an executing Pod, not both its controller and Pod.
            # These exclusions are limited to platform init/scanner containers
            # which require UID 0; their Kyverno findings remain reportable.
            query: 'event.dataset:"kyverno.policy_event" AND reason:"PolicyViolation" AND reportingComponent:"kyverno-admission" AND involvedObject.kind.keyword:"Pod" AND message:"policy audit-pod-security-context/ fail: Pods and containers must not explicitly run as UID 0." AND NOT (involvedObject.namespace.keyword:"elastic-stack" AND involvedObject.name.keyword:security-events-otel-collector*) AND NOT (involvedObject.namespace.keyword:"monitoring" AND involvedObject.name.keyword:kube-prometheus-stack-grafana-*) AND NOT (involvedObject.namespace.keyword:"security-kube-bench" AND (involvedObject.name.keyword:security-kube-bench-control-plane-* OR involvedObject.name.keyword:security-kube-bench-workers-*)) AND NOT (involvedObject.namespace.keyword:"longhorn-system" AND involvedObject.name.keyword:longhorn-driver-deployer-*)'
    realert:
      minutes: 1
    include_rule_params_in_matches:
      - pagerduty_routing_key
    alert:
      - post2
    http_post2_url: https://events.eu.pagerduty.com/v2/enqueue
    http_post2_all_values: false
    http_post2_payload: |-
      {
        "routing_key": "{{ rule_param_pagerduty_routing_key }}",
        "event_action": "trigger",
        "dedup_key": "kyverno-uid-zero-{{ involvedObject.uid }}",
        "payload": {
          "summary": "Kyverno observed a workload explicitly configured with UID 0",
          "source": "ultimate-iac-kyverno",
          "severity": "critical",
          "component": "kyverno",
          "group": "security-admission",
          "class": "pod-security-violation",
          "custom_details": {
            "event": "{{ metadata.name }}",
            "namespace": "{{ involvedObject.namespace }}",
            "workload_kind": "{{ involvedObject.kind }}",
            "workload": "{{ involvedObject.name }}",
            "policy": "audit-pod-security-context"
          }
        }
      }

  kyverno_privileged_container: |-
    name: Kyverno privileged container violation
    type: any
    index: kyverno-*
    # Use the original Kubernetes Event time so collector restarts and event
    # replays cannot turn an old violation into a new PagerDuty alert.
    timestamp_field: eventTime
    filter:
      - query:
          query_string:
            # Page only for an executing Pod, not both its controller and Pod.
            # Longhorn, Cilium, kube-proxy, and the SonarQube sysctl initializer
            # require privileged execution; Kyverno still records the findings.
            query: 'event.dataset:"kyverno.policy_event" AND reason:"PolicyViolation" AND reportingComponent:"kyverno-admission" AND involvedObject.kind.keyword:"Pod" AND message:"policy audit-pod-security-context/ fail: Containers must not run as privileged." AND NOT (involvedObject.namespace.keyword:"longhorn-system" AND (involvedObject.name.keyword:instance-manager-* OR involvedObject.name.keyword:discover-proc-kubelet-cmdline* OR involvedObject.name.keyword:longhorn-manager-* OR involvedObject.name.keyword:longhorn-csi-plugin-* OR involvedObject.name.keyword:engine-image-*)) AND NOT (involvedObject.namespace.keyword:"kube-system" AND (involvedObject.name.keyword:kube-proxy-* OR involvedObject.name.keyword:cilium-?????)) AND NOT (involvedObject.namespace.keyword:"security-sonarqube" AND involvedObject.name.keyword:"security-sonarqube-0")'
    realert:
      minutes: 1
    include_rule_params_in_matches:
      - pagerduty_routing_key
    alert:
      - post2
    http_post2_url: https://events.eu.pagerduty.com/v2/enqueue
    http_post2_all_values: false
    http_post2_payload: |-
      {
        "routing_key": "{{ rule_param_pagerduty_routing_key }}",
        "event_action": "trigger",
        "dedup_key": "kyverno-privileged-{{ involvedObject.uid }}",
        "payload": {
          "summary": "Kyverno observed a privileged container configuration",
          "source": "ultimate-iac-kyverno",
          "severity": "critical",
          "component": "kyverno",
          "group": "security-admission",
          "class": "privileged-container-violation",
          "custom_details": {
            "event": "{{ metadata.name }}",
            "namespace": "{{ involvedObject.namespace }}",
            "workload_kind": "{{ involvedObject.kind }}",
            "workload": "{{ involvedObject.name }}",
            "policy": "audit-pod-security-context"
          }
        }
      }

  kyverno_unapproved_capability_addition: |-
    name: Kyverno unapproved Linux capability addition
    type: any
    index: kyverno-*
    # Use the original Kubernetes Event time so collector restarts and event
    # replays cannot turn an old violation into a new PagerDuty alert. The
    # Kyverno policy itself contains the exact infrastructure exceptions.
    timestamp_field: eventTime
    filter:
      - query:
          query_string:
            query: 'event.dataset:"kyverno.policy_event" AND reason:"PolicyViolation" AND reportingComponent:"kyverno-admission" AND involvedObject.kind.keyword:"Pod" AND message:"policy audit-pod-security-context/ fail: Containers may add only NET_BIND_SERVICE or the capability set approved for their exact infrastructure identity."'
    realert:
      minutes: 1
    include_rule_params_in_matches:
      - pagerduty_routing_key
    alert:
      - post2
    http_post2_url: https://events.eu.pagerduty.com/v2/enqueue
    http_post2_all_values: false
    http_post2_payload: |-
      {
        "routing_key": "{{ rule_param_pagerduty_routing_key }}",
        "event_action": "trigger",
        "dedup_key": "kyverno-unapproved-capability-{{ involvedObject.uid }}",
        "payload": {
          "summary": "Kyverno observed an unapproved Linux capability addition",
          "source": "ultimate-iac-kyverno",
          "severity": "critical",
          "component": "kyverno",
          "group": "security-admission",
          "class": "linux-capability-violation",
          "custom_details": {
            "event": "{{ metadata.name }}",
            "namespace": "{{ involvedObject.namespace }}",
            "workload_kind": "{{ involvedObject.kind }}",
            "workload": "{{ involvedObject.name }}",
            "policy": "audit-pod-security-context",
            "violation": "{{ message }}"
          }
        }
      }

  kyverno_critical_direct_host_access: |-
    name: Kyverno critical direct host access
    type: any
    index: kyverno-*
    # Page only for new Pod admission. The Kyverno policy removes exact
    # infrastructure identities and path sets before violations reach here.
    timestamp_field: eventTime
    filter:
      - query:
          query_string:
            query: 'event.dataset:"kyverno.policy_event" AND reason:"PolicyViolation" AND reportingComponent:"kyverno-admission" AND involvedObject.kind.keyword:"Pod" AND (message:"policy audit-host-access/ fail: Pods must not use the host PID namespace without an exact approved identity." OR message:"policy audit-host-access/ fail: Pods must not use the host IPC namespace." OR message:"policy audit-host-access/ fail: Pods must not mount hostPath volumes outside their exact approved identity and path set." OR message:"policy audit-host-access/ fail: Approved read-only hostPath mounts must not become writable.")'
    realert:
      minutes: 1
    include_rule_params_in_matches:
      - pagerduty_routing_key
    alert:
      - post2
    http_post2_url: https://events.eu.pagerduty.com/v2/enqueue
    http_post2_all_values: false
    http_post2_payload: |-
      {
        "routing_key": "{{ rule_param_pagerduty_routing_key }}",
        "event_action": "trigger",
        "dedup_key": "kyverno-host-access-critical-{{ involvedObject.uid }}",
        "payload": {
          "summary": "Kyverno observed critical direct host access",
          "source": "ultimate-iac-kyverno",
          "severity": "critical",
          "component": "kyverno",
          "group": "security-admission",
          "class": "direct-host-access",
          "custom_details": {
            "event": "{{ metadata.name }}",
            "namespace": "{{ involvedObject.namespace }}",
            "workload_kind": "{{ involvedObject.kind }}",
            "workload": "{{ involvedObject.name }}",
            "policy": "audit-host-access",
            "violation": "{{ message }}"
          }
        }
      }

  kyverno_unapproved_host_network_exposure: |-
    name: Kyverno unapproved host network exposure
    type: any
    index: kyverno-*
    # Keep unexpected network exposure separate from direct filesystem and
    # process-namespace access so its PagerDuty severity can remain High.
    timestamp_field: eventTime
    filter:
      - query:
          query_string:
            query: 'event.dataset:"kyverno.policy_event" AND reason:"PolicyViolation" AND reportingComponent:"kyverno-admission" AND involvedObject.kind.keyword:"Pod" AND (message:"policy audit-host-access/ fail: Pods must not use the host network without an exact approved identity." OR message:"policy audit-host-access/ fail: Containers must not bind host ports outside their exact approved identity and port set.")'
    realert:
      minutes: 1
    include_rule_params_in_matches:
      - pagerduty_routing_key
    alert:
      - post2
    http_post2_url: https://events.eu.pagerduty.com/v2/enqueue
    http_post2_all_values: false
    http_post2_payload: |-
      {
        "routing_key": "{{ rule_param_pagerduty_routing_key }}",
        "event_action": "trigger",
        "dedup_key": "kyverno-host-network-high-{{ involvedObject.uid }}",
        "payload": {
          "summary": "Kyverno observed unapproved host network exposure",
          "source": "ultimate-iac-kyverno",
          "severity": "error",
          "component": "kyverno",
          "group": "security-admission",
          "class": "host-network-exposure",
          "custom_details": {
            "event": "{{ metadata.name }}",
            "namespace": "{{ involvedObject.namespace }}",
            "workload_kind": "{{ involvedObject.kind }}",
            "workload": "{{ involvedObject.name }}",
            "policy": "audit-host-access",
            "violation": "{{ message }}"
          }
        }
      }
