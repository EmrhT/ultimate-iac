apiVersion: v1
kind: ConfigMap
metadata:
  name: falco-talon-config
  namespace: falco
data:
  config.yaml: |
    listen_address: "0.0.0.0"
    listen_port: "2803"
    log_format: json
    watch_rules: true
    print_all_events: false
    deduplication:
      # A single replica removes the need for lease permissions.
      leader_election: false
      time_window_seconds: 5
    notifiers:
      webhook:
        # The collector stores only Talon's action result in falco-talon-*.
        url: http://security-events-otel-collector.elastic-stack.svc:8089/talon
        http_method: POST
        content_type: application/json; charset=utf-8
    default_notifiers:
      # Kubernetes events provide a lightweight, local record of each response.
      - k8sevents
      - webhook
  rules.yaml: |
    - action: Quarantine Pod
      description: Add the runtime response label consumed by the Git-managed Cilium policy.
      actionner: kubernetes:label
      parameters:
        labels:
          security.no-name.win/quarantined: "true"

    # Automatic response is an explicit workload decision. Falco copies the
    # enrollment Pod label into talon.quarantine for custom and built-in events;
    # namespace membership alone never authorizes containment.
    - rule: Quarantine enrolled application after reviewed Falco alarm
      match:
        rules:
          - Reverse Shell
          - Web-Originated Process Execution
          - Unexpected Network Listener
          - Payload Execution
          - Container Escape Behavior
          - Unexpected Root Process
          - Service Account Credential Access
          - Detect release_agent File Container Escapes
          - Fileless execution via memfd_create
        output_fields: [talon.quarantine=true]
      actions: [{action: Quarantine Pod}]
