controller:
  replicas: 1
  manager:
    image:
      repository: docker.io/hashicorp/vault-secrets-operator
      tag: 1.5.0@sha256:77d8c28e6f85796474ac76588ccdce75a1922687f2cb824b48d3eee144525768
    globalVaultAuthOptions:
      allowDefaultGlobals: false
    clientCache:
      persistenceModel: none
    resources:
      requests:
        cpu: 25m
        memory: 64Mi
      limits:
        cpu: 200m
        memory: 256Mi
  kubeRbacProxy:
    image:
      repository: quay.io/brancz/kube-rbac-proxy
      tag: v0.23.1@sha256:bb7c6fbfbb00cc2892e97fd102b8f01eb19eef09ce216385a7cf68ea7a9e7fac
    resources:
      requests:
        cpu: 5m
        memory: 32Mi
      limits:
        cpu: 100m
        memory: 64Mi

defaultVaultConnection:
  enabled: true
  address: http://vault.vault.svc.cluster.local:8200

csi:
  enabled: false
