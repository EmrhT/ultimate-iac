driver:
  kind: modern_ebpf
falco:
  json_output: true
  json_include_output_property: true
  # Evaluate all matching rules so the generic built-in reverse-shell rule
  # cannot hide the Podinfo-specific Critical rule loaded after it.
  rule_matching: all
  http_output:
    enabled: false
tty: false
serviceMonitor:
  create: true
  interval: 60s

# Alert only on a high-confidence reverse-shell behavior in the Podinfo demo
# workloads. A normal kubectl exec shell does not redirect its standard streams
# to a network socket and therefore does not match this rule.
customRules:
  podinfo-runtime.yaml: |-
    - rule: Podinfo Reverse Shell
      desc: Detect a Podinfo process redirecting stdin, stdout, or stderr to a network socket.
      # Requiring all three descriptors makes a complete reverse shell produce
      # one alert instead of separate alerts for individual dup2 syscalls.
      condition: >
        dup
        and container
        and evt.rawres in (0, 1, 2)
        and fd.type in ("ipv4", "ipv6")
        and fd.types[0] in ("ipv4", "ipv6")
        and fd.types[1] in ("ipv4", "ipv6")
        and fd.types[2] in ("ipv4", "ipv6")
        and container.name = podinfo
      output: >
        Podinfo reverse shell detected | namespace=%k8s.ns.name pod=%k8s.pod.name
        container=%container.name process=%proc.name parent=%proc.pname
        command=%proc.cmdline connection=%fd.name user=%user.name
      priority: CRITICAL
      tags: [container, network, shell, mitre_execution, T1059]

    # Podinfo is a self-contained Go service and does not normally launch child
    # processes. A process whose lineage starts at the application therefore
    # indicates web-originated command execution or an active web shell.
    - rule: Podinfo Web-Originated Process Execution
      desc: Detect command execution initiated by the Podinfo application rather than kubectl exec.
      condition: >
        spawned_process
        and container.name = podinfo
        and (proc.pname = podinfo or proc.aname[2] = podinfo)
      output: >
        Podinfo web-originated process detected | namespace=%k8s.ns.name pod=%k8s.pod.name
        container=%container.name process=%proc.name parent=%proc.pname
        command=%proc.cmdline user=%user.name
      priority: CRITICAL
      tags: [container, process, webshell, mitre_execution, T1190, T1059]

    # Port 9898 is Podinfo's only declared listener. Administrators should use
    # Netshoot for network troubleshooting instead of opening ports in Podinfo.
    - rule: Podinfo Unexpected Network Listener
      desc: Detect a bind shell or any undeclared listening port in Podinfo.
      condition: >
        evt.type = listen
        and evt.rawres = 0
        and container.name = podinfo
        and fd.type in ("ipv4", "ipv6")
        and fd.lport != 9898
      output: >
        Podinfo unexpected listener detected | namespace=%k8s.ns.name pod=%k8s.pod.name
        container=%container.name process=%proc.name parent=%proc.pname
        command=%proc.cmdline address=%fd.name port=%fd.lport user=%user.name
      priority: CRITICAL
      tags: [container, network, bind_shell, mitre_command_and_control, T1059]

    # Podinfo has a read-only root filesystem. Executing an upper-layer file is
    # therefore both an attack signal and evidence of a security regression.
    - rule: Podinfo Dropped Payload Execution
      desc: Detect Podinfo executing a binary or script written after the image was built.
      condition: >
        spawned_process
        and container.name = podinfo
        and proc.is_exe_upper_layer = true
      output: >
        Podinfo dropped payload executed | namespace=%k8s.ns.name pod=%k8s.pod.name
        container=%container.name process=%proc.name parent=%proc.pname
        executable=%proc.exepath command=%proc.cmdline user=%user.name
      priority: CRITICAL
      tags: [container, process, payload, mitre_execution, T1059]

    - list: podinfo_escape_tools
      items: [nsenter, unshare, mount, umount, setpriv, capsh, chroot, debugfs, bpftool, modprobe, insmod]

    # Podinfo needs none of these host/namespace manipulation tools. Matching
    # their execution is considerably less noisy than paging on every failed
    # low-level syscall while still covering common hands-on escape attempts.
    - rule: Podinfo Container Escape Tool Execution
      desc: Detect namespace, mount, capability, kernel or host manipulation tools in Podinfo.
      condition: >
        spawned_process
        and container.name = podinfo
        and proc.name in (podinfo_escape_tools)
      output: >
        Podinfo container escape tool detected | namespace=%k8s.ns.name pod=%k8s.pod.name
        container=%container.name process=%proc.name parent=%proc.pname
        command=%proc.cmdline capabilities=%thread.cap_effective user=%user.name
      priority: CRITICAL
      tags: [container, process, container_escape, mitre_privilege_escalation, T1611]

    # The workload is pinned to UID 10000. A newly spawned root process means
    # that this runtime invariant has been violated.
    - rule: Podinfo Unexpected Root Process
      desc: Detect successful privilege escalation resulting in a root process inside Podinfo.
      condition: >
        spawned_process
        and container.name = podinfo
        and user.uid = 0
      output: >
        Podinfo unexpected root process detected | namespace=%k8s.ns.name pod=%k8s.pod.name
        container=%container.name process=%proc.name parent=%proc.pname
        command=%proc.cmdline capabilities=%thread.cap_effective user=%user.name
      priority: CRITICAL
      tags: [container, process, privilege_escalation, mitre_privilege_escalation, T1068]

    # Podinfo explicitly disables service-account token automounting. Any
    # successful read below this path indicates credential injection or a
    # workload configuration regression.
    - rule: Podinfo Service Account Credential Access
      desc: Detect Podinfo reading Kubernetes service-account credentials that should not be mounted.
      condition: >
        open_read
        and container.name = podinfo
        and fd.name startswith "/var/run/secrets/kubernetes.io/serviceaccount/"
      output: >
        Podinfo service-account credential accessed | namespace=%k8s.ns.name pod=%k8s.pod.name
        container=%container.name process=%proc.name parent=%proc.pname
        file=%fd.name command=%proc.cmdline user=%user.name
      priority: CRITICAL
      tags: [container, credential_access, kubernetes, mitre_credential_access, T1552.007]

falcosidekick:
  enabled: true
  replicaCount: 1
  resources:
    requests:
      cpu: 25m
      memory: 32Mi
    limits:
      cpu: 100m
      memory: 128Mi
  serviceMonitor:
    enabled: true
    interval: 60s
  config:
    alertmanager:
      hostport: http://kube-prometheus-stack-alertmanager.monitoring.svc:9093
      endpoint: /api/v2/alerts
      # Default Falco Notice/Warning traffic remains visible in Falco logs but
      # cannot page PagerDuty. Only Critical and higher events are forwarded.
      minimumpriority: critical
      expireafter: "600"
      extralabels: team:security,detector:falco
