driver:
  kind: modern_ebpf
  modernEbpf:
    # The modern eBPF probe does not require a fully privileged container.
    # Let the chart grant only BPF, PERFMON, SYS_RESOURCE and SYS_PTRACE.
    leastPrivileged: true
falco:
  json_output: true
  json_include_output_property: true
  # Evaluate all matching rules so the generic built-in reverse-shell rule
  # cannot hide the Podinfo-specific Critical rule loaded after it.
  rule_matching: all
  http_output:
    enabled: false
tty: false
serviceMonitor:
  create: true
  interval: 60s

# Each detector is enabled per workload through its own boolean Pod label. Rule
# and alert names describe behavior rather than the application currently using
# the detector, so the same controls scale to additional workloads.
customRules:
  podinfo-runtime.yaml: |-
    - rule: Reverse Shell
      desc: Detect a selected workload process redirecting stdin, stdout, or stderr to a network socket.
      # Requiring all three descriptors makes a complete reverse shell produce
      # one alert instead of separate alerts for individual dup2 syscalls.
      condition: >
        dup
        and container
        and evt.rawres in (0, 1, 2)
        and fd.type in ("ipv4", "ipv6")
        and fd.types[0] in ("ipv4", "ipv6")
        and fd.types[1] in ("ipv4", "ipv6")
        and fd.types[2] in ("ipv4", "ipv6")
        and k8s.pod.label[security.no-name.win/falco-reverse-shell] = "true"
      output: >
        Reverse shell detected | namespace=%k8s.ns.name pod=%k8s.pod.name
        container=%container.name process=%proc.name parent=%proc.pname
        command=%proc.cmdline connection=%fd.name user=%user.name
      priority: CRITICAL
      tags: [container, network, shell, mitre_execution, T1059]

    # Podinfo is a self-contained Go service and does not normally launch child
    # processes. A process whose lineage starts at the application therefore
    # indicates web-originated command execution or an active web shell.
    - rule: Web-Originated Process Execution
      desc: Detect command execution initiated by the selected web application rather than kubectl exec.
      condition: >
        spawned_process
        and k8s.pod.label[security.no-name.win/falco-web-process] = "true"
        and (proc.pname = podinfo or proc.aname[2] = podinfo)
      output: >
        Web-originated process detected | namespace=%k8s.ns.name pod=%k8s.pod.name
        container=%container.name process=%proc.name parent=%proc.pname
        command=%proc.cmdline user=%user.name
      priority: CRITICAL
      tags: [container, process, webshell, mitre_execution, T1190, T1059]

    # Port 9898 is Podinfo's only declared listener. Detect the successful bind
    # rather than listen. Falco exposes the bound endpoint through evt.arg.addr
    # on this event; fd.lport is unset for bind and must not be used here.
    # Go also probes ::1:0 and IPv4-mapped loopback while selecting its
    # dual-stack strategy. Ignore only those exact short-lived local sockets.
    # Administrators should use Netshoot for network troubleshooting instead of
    # opening ports in Podinfo.
    - rule: Unexpected Network Listener
      desc: Detect a bind shell or an undeclared listening port in a selected workload.
      condition: >
        evt.type = bind
        and evt.rawres = 0
        and k8s.pod.label[security.no-name.win/falco-unexpected-listener] = "true"
        and fd.type in ("ipv4", "ipv6")
        and not evt.arg.addr endswith ":9898"
        and not evt.arg.addr in ("::1:0", "::ffff:127.0.0.1:0")
      output: >
        Unexpected network listener detected | namespace=%k8s.ns.name pod=%k8s.pod.name
        container=%container.name process=%proc.name parent=%proc.pname
        command=%proc.cmdline address=%evt.arg.addr user=%user.name
      priority: CRITICAL
      tags: [container, network, bind_shell, mitre_command_and_control, T1059]

    - list: payload_interpreters
      items: [sh, bash, dash, ash, python, python3, perl, ruby, node]

    # One payload rule covers native binaries written to the overlay layer,
    # anonymous in-memory executables, executables on common writable mounts,
    # and interpreters loading scripts from those writable locations.
    - rule: Payload Execution
      desc: Detect a selected workload executing payloads from writable storage or anonymous memory.
      condition: >
        spawned_process
        and k8s.pod.label[security.no-name.win/falco-payload-execution] = "true"
        and
        (
          proc.is_exe_upper_layer = true
          or proc.is_exe_from_memfd = true
          or proc.exepath startswith "/tmp/"
          or proc.exepath startswith "/var/tmp/"
          or proc.exepath startswith "/dev/shm/"
          or proc.exepath startswith "/run/"
          or proc.exepath startswith "/work/"
          or proc.exepath startswith "/data/"
          or
          (
            proc.name in (payload_interpreters)
            and
            (
              proc.args contains "/tmp/"
              or proc.args contains "/var/tmp/"
              or proc.args contains "/dev/shm/"
              or proc.args contains "/run/"
              or proc.args contains "/work/"
              or proc.args contains "/data/"
            )
          )
        )
      output: >
        Payload executed | namespace=%k8s.ns.name pod=%k8s.pod.name
        container=%container.name process=%proc.name parent=%proc.pname
        executable=%proc.exepath command=%proc.cmdline upper_layer=%proc.is_exe_upper_layer
        memfd=%proc.is_exe_from_memfd user=%user.name
      priority: CRITICAL
      tags: [container, process, payload, mitre_execution, T1059]

    - list: container_escape_tools
      items: [nsenter, unshare, mount, umount, setpriv, capsh, chroot, debugfs, bpftool, modprobe, insmod]

    - list: container_escape_syscalls
      items: [setns, unshare, mount, umount, umount2, pivot_root, chroot, init_module, finit_module, delete_module, bpf, open_by_handle_at]

    # Tool names provide useful operator context, while the syscall branches
    # also detect renamed, statically linked, and custom escape payloads. Clone
    # is restricted to namespace-creation flags because ordinary clone calls
    # are expected from application runtimes.
    - rule: Container Escape Behavior
      desc: Detect namespace, mount, root, kernel or host manipulation by a selected workload.
      condition: >
        k8s.pod.label[security.no-name.win/falco-container-escape] = "true"
        and
        (
          (spawned_process and proc.name in (container_escape_tools))
          or evt.type in (container_escape_syscalls)
          or
          (
            evt.type in (clone, clone3)
            and
            (
              evt.arg.flags contains CLONE_NEWCGROUP
              or evt.arg.flags contains CLONE_NEWIPC
              or evt.arg.flags contains CLONE_NEWNET
              or evt.arg.flags contains CLONE_NEWNS
              or evt.arg.flags contains CLONE_NEWPID
              or evt.arg.flags contains CLONE_NEWTIME
              or evt.arg.flags contains CLONE_NEWUSER
              or evt.arg.flags contains CLONE_NEWUTS
            )
          )
        )
      output: >
        Container escape behavior detected | namespace=%k8s.ns.name pod=%k8s.pod.name
        container=%container.name process=%proc.name parent=%proc.pname
        command=%proc.cmdline syscall=%evt.type result=%evt.res
        capabilities=%thread.cap_effective user=%user.name
      priority: CRITICAL
      tags: [container, process, syscall, container_escape, mitre_privilege_escalation, T1611]

    # The workload is pinned to UID 10000. A newly spawned root process means
    # that this runtime invariant has been violated. Ignore runc's transient
    # exec-init helper: it is created by the container runtime for kubectl exec
    # before the requested process starts with the container's configured UID.
    # Kubernetes audit events independently classify who requested the exec.
    - rule: Unexpected Root Process
      desc: Detect successful privilege escalation resulting in a root process inside a selected workload.
      condition: >
        spawned_process
        and k8s.pod.label[security.no-name.win/falco-unexpected-root] = "true"
        and user.uid = 0
        and proc.pname != runc
      output: >
        Unexpected root process detected | namespace=%k8s.ns.name pod=%k8s.pod.name
        container=%container.name process=%proc.name parent=%proc.pname
        command=%proc.cmdline capabilities=%thread.cap_effective user=%user.name
      priority: CRITICAL
      tags: [container, process, privilege_escalation, mitre_privilege_escalation, T1068]

    # Podinfo explicitly disables service-account token automounting. Any
    # successful read below this path indicates credential injection or a
    # workload configuration regression.
    - rule: Service Account Credential Access
      desc: Detect a selected workload reading Kubernetes service-account credentials that should not be mounted.
      condition: >
        open_read
        and k8s.pod.label[security.no-name.win/falco-service-account-access] = "true"
        and fd.name startswith "/var/run/secrets/kubernetes.io/serviceaccount/"
      output: >
        Service-account credential accessed | namespace=%k8s.ns.name pod=%k8s.pod.name
        container=%container.name process=%proc.name parent=%proc.pname
        file=%fd.name command=%proc.cmdline user=%user.name
      priority: CRITICAL
      tags: [container, credential_access, kubernetes, mitre_credential_access, T1552.007]

falcosidekick:
  enabled: true
  replicaCount: 1
  resources:
    requests:
      cpu: 25m
      memory: 32Mi
    limits:
      cpu: 100m
      memory: 128Mi
  serviceMonitor:
    enabled: true
    interval: 60s
  config:
    webhook:
      # Falcosidekick has no OTLP logs output. Send its native Falco JSON to
      # OTel's webhook receiver; ElastAlert evaluates the indexed copy and
      # Alertmanager remains reserved for Hubble's metric-based alerts.
      address: http://security-events-otel-collector.elastic-stack.svc:8088/falco
      method: POST
      minimumpriority: critical
