apiVersion: v1
kind: ServiceAccount
metadata:
  name: security-falco-defectdojo
  annotations:
    argocd.argoproj.io/sync-wave: "-30"
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: security-falco-defectdojo-log-reader
  annotations:
    argocd.argoproj.io/sync-wave: "-30"
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list"]
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: security-falco-defectdojo-log-reader
  annotations:
    argocd.argoproj.io/sync-wave: "-30"
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: security-falco-defectdojo-log-reader
subjects:
  - kind: ServiceAccount
    name: security-falco-defectdojo
    namespace: falco

