apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base
patches:
  - target:
      group: metallb.io
      version: v1beta1
      kind: IPAddressPool
      name: platform-services
    patch: |-
      - op: replace
        path: /spec/addresses/0
        value: 192.168.122.120-192.168.122.129

