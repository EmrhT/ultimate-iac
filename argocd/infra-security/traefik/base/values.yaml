providers:
  kubernetesCRD:
    enabled: true
  kubernetesIngress:
    enabled: false
  kubernetesGateway:
    enabled: true
gatewayClass:
  enabled: true
  name: traefik
gateway:
  enabled: true
  name: traefik
  listeners:
    web:
      port: 8000
      protocol: HTTP
      namespacePolicy:
        from: All
ingressRoute:
  dashboard:
    enabled: true
    matchRule: Host(`traefik.no-name.win`)
    entryPoints:
      - web
service:
  spec:
    type: LoadBalancer
    loadBalancerIP: 192.168.122.120
log:
  level: INFO
accessLog:
  enabled: true
  format: json
metrics:
  prometheus:
    service:
      enabled: true
    serviceMonitor:
      enabled: true
