image:
  registry: docker.io
  repository: library/traefik
  digest: sha256:5902d68e00708015736416b62faa49d23a2e1d4415649e5831d20b79ba301508

versionOverride: v3.7.14

deployment:
  podLabels:
    security.no-name.win/falco-reverse-shell: "true"
    security.no-name.win/falco-web-process: "false"
    security.no-name.win/falco-unexpected-listener: "false"
    security.no-name.win/falco-payload-execution: "true"
    security.no-name.win/falco-container-escape: "true"
    security.no-name.win/falco-unexpected-root: "false"
    security.no-name.win/falco-service-account-access: "false"

providers:
  kubernetesCRD:
    enabled: false
  kubernetesIngress:
    enabled: false
  kubernetesGateway:
    enabled: true
ingressClass:
  enabled: false
gatewayClass:
  enabled: true
  name: traefik
gateway:
  enabled: true
  name: traefik
  listeners:
    web:
      port: 8000
      protocol: HTTP
      namespacePolicy:
        from: All
    websecure:
      port: 8443
      protocol: HTTPS
      namespacePolicy:
        from: All
      certificateRefs:
        - group: ""
          kind: Secret
          name: no-name-win-wildcard-tls
      mode: Terminate
ingressRoute:
  dashboard:
    enabled: false
api:
  dashboard: true
  insecure: false
ports:
  web:
    expose:
      default: true
    http:
      redirections:
        entryPoint:
          to: websecure
          scheme: https
          permanent: true
service:
  spec:
    type: LoadBalancer
    loadBalancerIP: 192.168.122.120
log:
  level: INFO
accessLog:
  enabled: true
  format: json
metrics:
  prometheus:
    service:
      enabled: true
    serviceMonitor:
      enabled: true
