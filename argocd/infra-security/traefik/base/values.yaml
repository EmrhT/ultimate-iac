providers:
  kubernetesCRD:
    enabled: false
  kubernetesIngress:
    enabled: false
  kubernetesGateway:
    enabled: true
gatewayClass:
  enabled: true
  name: traefik
gateway:
  enabled: true
  name: traefik
  listeners:
    web:
      port: 8000
      protocol: HTTP
      namespacePolicy:
        from: All
service:
  type: LoadBalancer
  spec:
    loadBalancerIP: 192.168.122.120
logs:
  general:
    level: INFO
  access:
    enabled: true
    format: json
metrics:
  prometheus:
    service:
      enabled: true
    serviceMonitor:
      enabled: true

