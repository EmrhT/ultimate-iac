apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: keycloak-platform-admins
subjects:
  - kind: Group
    # Keycloak emits /platform/admins; kube-apiserver adds the keycloak: prefix.
    name: keycloak:/platform/admins
    apiGroup: rbac.authorization.k8s.io
roleRef:
  kind: ClusterRole
  name: cluster-admin
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: keycloak-platform-devs
  namespace: lab-a-dev
subjects:
  - kind: Group
    name: keycloak:/platform/devs
    apiGroup: rbac.authorization.k8s.io
roleRef:
  kind: ClusterRole
  name: keycloak-dev-reader
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: keycloak-platform-devs
  namespace: lab-b-dev
subjects:
  - kind: Group
    name: keycloak:/platform/devs
    apiGroup: rbac.authorization.k8s.io
roleRef:
  kind: ClusterRole
  name: keycloak-dev-reader
  apiGroup: rbac.authorization.k8s.io
