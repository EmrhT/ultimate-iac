apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: keycloak-dev-reader
rules:
  # Developers may inspect application configuration and workload state.
  - apiGroups: [""]
    resources:
      - configmaps
      - pods
    verbs:
      - get
      - list
      - watch
  # Reading logs is separate from reading the Pod object.
  - apiGroups: [""]
    resources:
      - pods/log
    verbs:
      - get
  - apiGroups:
      - apps
    resources:
      - deployments
      - statefulsets
    verbs:
      - get
      - list
      - watch
