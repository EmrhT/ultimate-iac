# Manual audit fixture. This file is intentionally not included by Kustomize.
apiVersion: v1
kind: Pod
metadata:
  name: kyverno-audit-fixture
  namespace: default
spec:
  hostIPC: true
  containers:
    - name: app
      image: nginx:latest
      securityContext:
        capabilities:
          drop: [ALL]
          add: [SYS_ADMIN]
      volumeMounts:
        - name: host-root
          mountPath: /host
          readOnly: true
  volumes:
    - name: host-root
      hostPath:
        path: /
