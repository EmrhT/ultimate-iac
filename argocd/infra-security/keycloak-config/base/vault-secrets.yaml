apiVersion: v1
kind: ServiceAccount
metadata:
  name: vault-auth
  annotations:
    argocd.argoproj.io/sync-wave: "-30"
---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultAuth
metadata:
  name: keycloak
  annotations:
    argocd.argoproj.io/sync-wave: "-29"
spec:
  vaultConnectionRef: vault-secrets-operator/default
  method: kubernetes
  mount: kubernetes
  kubernetes:
    role: vso-admin
    serviceAccount: vault-auth
    audiences:
      - vault
---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: keycloak-credentials
  annotations:
    argocd.argoproj.io/sync-wave: "-28"
spec:
  vaultAuthRef: keycloak
  mount: kv
  type: kv-v2
  path: infra/keycloak/credentials
  refreshAfter: 1m
  hmacSecretData: true
  destination:
    create: true
    overwrite: true
    name: keycloak-credentials
    type: Opaque
