apiVersion: batch/v1
kind: CronJob
metadata:
  name: security-kube-bench-workers
  annotations:
    argocd.argoproj.io/ignore-healthcheck: "true"
spec:
  schedule: "10 3 * * *"
  timeZone: Europe/Istanbul
  suspend: false
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 600
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 1
  jobTemplate:
    spec:
      completions: 3
      parallelism: 3
      activeDeadlineSeconds: 1200
      backoffLimit: 0
      ttlSecondsAfterFinished: 1800
      template:
        metadata:
          labels:
            app.kubernetes.io/name: security-kube-bench-worker
        spec:
          serviceAccountName: security-kube-bench-workers
          automountServiceAccountToken: false
          hostPID: true
          restartPolicy: Never
          affinity:
            nodeAffinity:
              requiredDuringSchedulingIgnoredDuringExecution:
                nodeSelectorTerms:
                  - matchExpressions:
                      - key: node-role.kubernetes.io/control-plane
                        operator: DoesNotExist
                      - key: node-role.kubernetes.io/master
                        operator: DoesNotExist
            podAntiAffinity:
              requiredDuringSchedulingIgnoredDuringExecution:
                - labelSelector:
                    matchLabels:
                      app.kubernetes.io/name: security-kube-bench-worker
                  topologyKey: kubernetes.io/hostname
          securityContext:
            fsGroup: 1000
            seccompProfile:
              type: RuntimeDefault
          initContainers:
            - name: scanner
              image: docker.io/aquasec/kube-bench:v0.16.0
              imagePullPolicy: IfNotPresent
              command:
                - /bin/sh
                - -ec
              args:
                - kube-bench run --targets node --json > /reports/kube-bench.json
              securityContext:
                runAsUser: 0
                runAsGroup: 0
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: ["ALL"]
              resources:
                requests:
                  cpu: 100m
                  memory: 128Mi
                  ephemeral-storage: 32Mi
                limits:
                  cpu: 500m
                  memory: 512Mi
                  ephemeral-storage: 128Mi
              volumeMounts:
                - name: reports
                  mountPath: /reports
                - name: tmp
                  mountPath: /tmp
                - name: var-lib-cni
                  mountPath: /var/lib/cni
                  readOnly: true
                - name: var-lib-kubelet
                  mountPath: /var/lib/kubelet
                  readOnly: true
                - name: etc-systemd
                  mountPath: /etc/systemd
                  readOnly: true
                - name: lib-systemd
                  mountPath: /lib/systemd
                  readOnly: true
                - name: etc-kubernetes
                  mountPath: /etc/kubernetes
                  readOnly: true
                - name: usr-bin
                  mountPath: /usr/local/mount-from-host/bin
                  readOnly: true
                - name: etc-cni-netd
                  mountPath: /etc/cni/net.d
                  readOnly: true
                - name: opt-cni-bin
                  mountPath: /opt/cni/bin
                  readOnly: true
                - name: etc-passwd
                  mountPath: /etc/passwd
                  readOnly: true
                - name: etc-group
                  mountPath: /etc/group
                  readOnly: true
          containers:
            - name: defectdojo-uploader
              image: curlimages/curl:8.21.0
              imagePullPolicy: IfNotPresent
              command: ["/scripts/upload.sh"]
              env:
                - name: NODE_NAME
                  valueFrom:
                    fieldRef:
                      fieldPath: spec.nodeName
                - name: DEFECTDOJO_API_TOKEN
                  valueFrom:
                    secretKeyRef:
                      name: security-kube-bench-defectdojo
                      key: api-token
              securityContext:
                runAsNonRoot: true
                runAsUser: 1000
                runAsGroup: 1000
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: ["ALL"]
              resources:
                requests:
                  cpu: 10m
                  memory: 16Mi
                  ephemeral-storage: 8Mi
                limits:
                  cpu: 100m
                  memory: 64Mi
                  ephemeral-storage: 32Mi
              volumeMounts:
                - name: reports
                  mountPath: /reports
                - name: uploader
                  mountPath: /scripts
                  readOnly: true
          volumes:
            - name: reports
              emptyDir:
                sizeLimit: 16Mi
            - name: tmp
              emptyDir:
                sizeLimit: 16Mi
            - name: uploader
              configMap:
                name: security-kube-bench-uploader
                defaultMode: 0555
            - name: var-lib-cni
              hostPath:
                path: /var/lib/cni
            - name: var-lib-kubelet
              hostPath:
                path: /var/lib/kubelet
            - name: etc-systemd
              hostPath:
                path: /etc/systemd
            - name: lib-systemd
              hostPath:
                path: /lib/systemd
            - name: etc-kubernetes
              hostPath:
                path: /etc/kubernetes
            - name: usr-bin
              hostPath:
                path: /usr/bin
            - name: etc-cni-netd
              hostPath:
                path: /etc/cni/net.d
            - name: opt-cni-bin
              hostPath:
                path: /opt/cni/bin
            - name: etc-passwd
              hostPath:
                path: /etc/passwd
                type: File
            - name: etc-group
              hostPath:
                path: /etc/group
                type: File
