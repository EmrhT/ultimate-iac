apiVersion: batch/v1
kind: Job
metadata:
  name: security-sonarqube-bootstrap
  annotations:
    argocd.argoproj.io/sync-wave: "-29"
    argocd.argoproj.io/sync-options: Force=true,Replace=true
spec:
  backoffLimit: 3
  template:
    metadata:
      labels:
        app.kubernetes.io/name: security-sonarqube-bootstrap
    spec:
      serviceAccountName: security-sonarqube-bootstrap
      automountServiceAccountToken: true
      restartPolicy: OnFailure
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        fsGroup: 65534
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: secret-bootstrap
          image: alpine:3.22.1
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          command:
            - /bin/sh
            - -ec
            - |
              API="https://${KUBERNETES_SERVICE_HOST}:${KUBERNETES_SERVICE_PORT_HTTPS}"
              SA=/var/run/secrets/kubernetes.io/serviceaccount
              TOKEN="$(cat "${SA}/token")"
              SECRET_URL="${API}/api/v1/namespaces/security-sonarqube/secrets/security-sonarqube-credentials"

              if wget -q --ca-certificate="${SA}/ca.crt" \
                --header="Authorization: Bearer ${TOKEN}" \
                -O /dev/null "${SECRET_URL}"; then
                echo "security-sonarqube-credentials already exists"
                exit 0
              fi

              POSTGRES_PASSWORD="$(od -An -N24 -tx1 /dev/urandom | tr -d ' \n')"
              ADMIN_PASSWORD="$(od -An -N24 -tx1 /dev/urandom | tr -d ' \n')"
              MONITORING_PASSCODE="$(od -An -N24 -tx1 /dev/urandom | tr -d ' \n')"

              cat > /tmp/secret.json <<EOF
              {"apiVersion":"v1","kind":"Secret","metadata":{"name":"security-sonarqube-credentials","namespace":"security-sonarqube"},"type":"Opaque","stringData":{"postgres-password":"${POSTGRES_PASSWORD}","password":"${ADMIN_PASSWORD}","currentPassword":"admin","monitoring-passcode":"${MONITORING_PASSCODE}"}}
              EOF

              wget -q --ca-certificate="${SA}/ca.crt" \
                --header="Authorization: Bearer ${TOKEN}" \
                --header="Content-Type: application/json" \
                --post-file=/tmp/secret.json \
                -O /dev/null \
                "${API}/api/v1/namespaces/security-sonarqube/secrets"
              echo "created security-sonarqube-credentials"
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
              ephemeral-storage: 8Mi
            limits:
              cpu: 100m
              memory: 32Mi
              ephemeral-storage: 16Mi
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 8Mi
