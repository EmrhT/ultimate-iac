apiVersion: v1
kind: Service
metadata:
  name: security-sonarqube-postgresql
  annotations:
    argocd.argoproj.io/sync-wave: "-20"
spec:
  clusterIP: None
  selector:
    app.kubernetes.io/name: security-sonarqube-postgresql
  ports:
    - name: postgresql
      port: 5432
      targetPort: postgresql
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: security-sonarqube-postgresql
  annotations:
    argocd.argoproj.io/sync-wave: "-20"
spec:
  replicas: 1
  serviceName: security-sonarqube-postgresql
  selector:
    matchLabels:
      app.kubernetes.io/name: security-sonarqube-postgresql
  template:
    metadata:
      labels:
        app.kubernetes.io/name: security-sonarqube-postgresql
        app.kubernetes.io/part-of: security-sonarqube
    spec:
      serviceAccountName: security-sonarqube-postgresql
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 70
        runAsGroup: 70
        fsGroup: 70
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: postgresql
          image: postgres:17.10-alpine3.22
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          args:
            - -c
            - shared_buffers=64MB
            - -c
            - max_connections=30
            - -c
            - min_wal_size=32MB
            - -c
            - max_wal_size=128MB
            - -c
            - wal_keep_size=0
            - -c
            - logging_collector=off
            - -c
            - log_min_duration_statement=-1
          env:
            - name: POSTGRES_DB
              value: sonarqube
            - name: POSTGRES_USER
              value: sonarqube
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: security-sonarqube-credentials
                  key: postgres-password
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          ports:
            - name: postgresql
              containerPort: 5432
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "sonarqube", "-d", "sonarqube"]
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", "sonarqube", "-d", "sonarqube"]
            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 3
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
              ephemeral-storage: 32Mi
            limits:
              cpu: 500m
              memory: 384Mi
              ephemeral-storage: 64Mi
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
            - name: run
              mountPath: /var/run/postgresql
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: run
          emptyDir:
            sizeLimit: 8Mi
        - name: tmp
          emptyDir:
            sizeLimit: 16Mi
  volumeClaimTemplates:
    - apiVersion: v1
      kind: PersistentVolumeClaim
      metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        volumeMode: Filesystem
        storageClassName: longhorn
        resources:
          requests:
            storage: 500Mi
