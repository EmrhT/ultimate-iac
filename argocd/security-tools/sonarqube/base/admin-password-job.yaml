apiVersion: batch/v1
kind: Job
metadata:
  name: security-sonarqube-admin-password
  annotations:
    argocd.argoproj.io/sync-wave: "10"
    argocd.argoproj.io/sync-options: Force=true,Replace=true
spec:
  backoffLimit: 12
  template:
    metadata:
      labels:
        app.kubernetes.io/name: security-sonarqube-admin-password
    spec:
      automountServiceAccountToken: false
      restartPolicy: OnFailure
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: password-bootstrap
          image: curlimages/curl:8.15.0
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          env:
            - name: ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: security-sonarqube-credentials
                  key: password
          command:
            - /bin/sh
            - -ec
            - |
              SONAR_URL=http://security-sonarqube:9000
              until curl -fsS "${SONAR_URL}/api/system/status" | grep -q '"status":"UP"'; do
                sleep 10
              done

              if curl -fsS -u "admin:${ADMIN_PASSWORD}" \
                "${SONAR_URL}/api/authentication/validate" | grep -q '"valid":true'; then
                echo "SonarQube admin password is already initialized"
                exit 0
              fi

              curl -fsS -u admin:admin -X POST \
                "${SONAR_URL}/api/users/change_password" \
                --data-urlencode login=admin \
                --data-urlencode previousPassword=admin \
                --data-urlencode "password=${ADMIN_PASSWORD}"
              echo "initialized SonarQube admin password"
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
              ephemeral-storage: 8Mi
            limits:
              cpu: 100m
              memory: 32Mi
              ephemeral-storage: 16Mi
