community:
  enabled: true

fullnameOverride: security-sonarqube

replicaCount: 1
revisionHistoryLimit: 2

serviceAccount:
  create: true
  name: security-sonarqube
  automountToken: false

service:
  type: ClusterIP
  externalPort: 9000
  internalPort: 9000

resources:
  requests:
    cpu: 400m
    memory: 2Gi
    ephemeral-storage: 512Mi
  limits:
    cpu: "2"
    memory: 3Gi
    ephemeral-storage: 2Gi

env:
  - name: SONAR_WEB_JAVAOPTS
    value: -Xms128m -Xmx512m
  - name: SONAR_CE_JAVAOPTS
    value: -Xms128m -Xmx512m
  - name: SONAR_SEARCH_JAVAOPTS
    value: -Xms512m -Xmx512m -XX:MaxDirectMemorySize=256m

persistence:
  enabled: false

emptyDir:
  sizeLimit: 2Gi

# Search indexes and local logs are rebuildable. Tight rotation limits
# ephemeral-storage churn while PostgreSQL remains the authoritative store.
sonarProperties:
  sonar.log.level: INFO
  sonar.log.rollingPolicy: "size:1MB"
  sonar.log.maxFiles: 2
  sonar.web.accessLogs.enable: false

jdbcOverwrite:
  enabled: true
  jdbcUrl: jdbc:postgresql://security-sonarqube-postgresql:5432/sonarqube
  jdbcUsername: sonarqube
  jdbcSecretName: security-sonarqube-credentials
  jdbcSecretPasswordKey: postgres-password

monitoringPasscodeSecretName: security-sonarqube-credentials
monitoringPasscodeSecretKey: monitoring-passcode

prometheusMonitoring:
  podMonitor:
    enabled: false

initContainers:
  resources:
    requests:
      cpu: 10m
      memory: 16Mi
    limits:
      cpu: 100m
      memory: 64Mi

initSysctl:
  enabled: true

initFs:
  enabled: true

tests:
  enabled: false

mcp:
  enabled: false
