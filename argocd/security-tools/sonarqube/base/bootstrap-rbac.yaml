apiVersion: v1
kind: ServiceAccount
metadata:
  name: security-sonarqube-bootstrap
  annotations:
    argocd.argoproj.io/sync-wave: "-30"
automountServiceAccountToken: true
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: security-sonarqube-bootstrap
  annotations:
    argocd.argoproj.io/sync-wave: "-30"
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: security-sonarqube-bootstrap
  annotations:
    argocd.argoproj.io/sync-wave: "-30"
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: security-sonarqube-bootstrap
subjects:
  - kind: ServiceAccount
    name: security-sonarqube-bootstrap
