apiVersion: batch/v1
kind: CronJob
metadata:
  name: security-sonarqube-scan
spec:
  schedule: "0 0 1 1 *"
  timeZone: Europe/Istanbul
  suspend: true
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 2
  jobTemplate:
    spec:
      backoffLimit: 0
      ttlSecondsAfterFinished: 86400
      template:
        metadata:
          labels:
            app.kubernetes.io/name: security-sonarqube-scan
        spec:
          serviceAccountName: security-sonarqube-scan
          automountServiceAccountToken: false
          restartPolicy: Never
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            fsGroup: 1000
            seccompProfile:
              type: RuntimeDefault
          initContainers:
            - name: source
              image: docker.io/alpine/git:2.54.0@sha256:cf7d0aa63721bcb75bf43a875619e47792a2f9a3b1e35cc65e45c254ae5436e4
              imagePullPolicy: IfNotPresent
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop: ["ALL"]
              command:
                - /bin/sh
                - -ec
                - git clone --depth=1 https://github.com/EmrhT/podinfo-emrah.git /workspace
              resources:
                requests:
                  cpu: 25m
                  memory: 32Mi
                  ephemeral-storage: 16Mi
                limits:
                  cpu: 250m
                  memory: 128Mi
                  ephemeral-storage: 64Mi
              volumeMounts:
                - name: workspace
                  mountPath: /workspace
          containers:
            - name: scanner
              image: docker.io/sonarsource/sonar-scanner-cli:12.4.0.4321_8.4.0@sha256:6e6eca4d552695a98fb7dab84f0c1bd0885ebbfe272654d1552e24bd7f452d51
              imagePullPolicy: IfNotPresent
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop: ["ALL"]
              env:
                - name: SONAR_HOST_URL
                  value: http://security-sonarqube:9000
                - name: SONAR_TOKEN
                  valueFrom:
                    secretKeyRef:
                      name: security-sonarqube-scanner-token
                      key: token
              args:
                - -Dsonar.projectKey=podinfo-emrah
                - -Dsonar.projectName=podinfo-emrah
                - -Dsonar.sources=.
                - -Dsonar.qualitygate.wait=true
              workingDir: /workspace
              resources:
                requests:
                  cpu: 100m
                  memory: 256Mi
                  ephemeral-storage: 128Mi
                limits:
                  cpu: "1"
                  memory: 1Gi
                  ephemeral-storage: 512Mi
              volumeMounts:
                - name: workspace
                  mountPath: /workspace
                - name: scanner-cache
                  mountPath: /opt/sonar-scanner/.sonar/cache
          volumes:
            - name: workspace
              emptyDir:
                sizeLimit: 512Mi
            - name: scanner-cache
              emptyDir:
                sizeLimit: 512Mi
