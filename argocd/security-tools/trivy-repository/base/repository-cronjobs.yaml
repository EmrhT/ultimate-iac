apiVersion: batch/v1
kind: CronJob
metadata:
  name: security-trivy-repository-podinfo
  labels:
    security.no-name.win/trivy-scan-excluded: "true"
  annotations:
    argocd.argoproj.io/ignore-healthcheck: "true"
spec:
  schedule: "0 23 * * *"
  timeZone: Europe/Istanbul
  suspend: false
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 900
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    metadata:
      labels:
        security.no-name.win/trivy-scan-excluded: "true"
    spec:
      activeDeadlineSeconds: 3600
      backoffLimit: 0
      ttlSecondsAfterFinished: 86400
      template:
        metadata:
          labels:
            app.kubernetes.io/name: security-trivy-repository-podinfo
            security.no-name.win/trivy-scan-excluded: "true"
        spec:
          serviceAccountName: security-trivy-repository
          automountServiceAccountToken: false
          restartPolicy: Never
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            fsGroup: 1000
            seccompProfile:
              type: RuntimeDefault
          initContainers:
            - name: checkout
              image: docker.io/alpine/git:2.52.0@sha256:4a0e72d49596a1f5d3701aeedafdadc5c0da4062be4657c7bdc4017387f591cc
              imagePullPolicy: IfNotPresent
              command: ["/bin/sh", "-c"]
              args:
                - git clone --depth=1 --branch master
                  https://github.com/EmrhT/podinfo-emrah.git /workspace
              env:
                - name: HOME
                  value: /tmp
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: ["ALL"]
              resources:
                requests:
                  cpu: 25m
                  memory: 32Mi
                  ephemeral-storage: 16Mi
                limits:
                  cpu: 250m
                  memory: 128Mi
                  ephemeral-storage: 64Mi
              volumeMounts:
                - name: workspace
                  mountPath: /workspace
                - name: git-tmp
                  mountPath: /tmp
            - name: scanner
              image: docker.io/aquasec/trivy:0.76.2@sha256:6fa071ef8daa2e58b90cbf1710bedca91adbb3bf98693533226f442035b836a6
              imagePullPolicy: IfNotPresent
              command: ["trivy"]
              args:
                - repository
                - --server
                - http://security-trivy.security-trivy.svc.cluster.local:4954
                - --scanners
                - vuln
                - --severity
                - UNKNOWN,MEDIUM,HIGH,CRITICAL
                - --format
                - json
                - --output
                - /reports/trivy-raw.json
                - --timeout
                - 30m
                - --cache-dir
                - /cache
                - --no-progress
                - --include-dev-deps
                - /workspace
              env:
                - name: TMPDIR
                  value: /tmp/trivy
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: ["ALL"]
              resources:
                requests:
                  cpu: 100m
                  memory: 256Mi
                  ephemeral-storage: 256Mi
                limits:
                  cpu: "1"
                  memory: 1Gi
                  ephemeral-storage: 2Gi
              volumeMounts:
                - name: reports
                  mountPath: /reports
                - name: cache
                  mountPath: /cache
                - name: tmp
                  mountPath: /tmp/trivy
                - name: workspace
                  mountPath: /workspace
                  readOnly: true
            - name: normalizer
              image: docker.io/mikefarah/yq:4.49.2@sha256:224eec1bdaf4903221117d65dd95a0f4f4a6d4e46c88e2c81e09398d1f2753a1
              imagePullPolicy: IfNotPresent
              command: ["/bin/sh", "/scripts/normalize.sh"]
              env:
                - name: REPOSITORY_NAME
                  value: podinfo-emrah
                - name: REPOSITORY_URL
                  value: https://github.com/EmrhT/podinfo-emrah.git
                - name: PAGERDUTY_ROUTING_KEY
                  valueFrom:
                    secretKeyRef:
                      name: security-trivy-repository-pagerduty
                      key: routing-key
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: ["ALL"]
              resources:
                requests:
                  cpu: 25m
                  memory: 64Mi
                  ephemeral-storage: 16Mi
                limits:
                  cpu: 250m
                  memory: 256Mi
                  ephemeral-storage: 64Mi
              volumeMounts:
                - name: reports
                  mountPath: /reports
                - name: scripts
                  mountPath: /scripts
                  readOnly: true
          containers:
            - name: uploader
              image: docker.io/curlimages/curl:8.23.0@sha256:3fb7e13e5d179a845c97d78204f3f1064d1907037f26a3ebf91710571151fd93
              imagePullPolicy: IfNotPresent
              command: ["/bin/sh", "/scripts/upload.sh"]
              env:
                - name: REPOSITORY_NAME
                  value: podinfo-emrah
                - name: REPOSITORY_BRANCH
                  value: master
                - name: ENGAGEMENT_NAME
                  value: Podinfo
                - name: DEFECTDOJO_API_TOKEN
                  valueFrom:
                    secretKeyRef:
                      name: security-trivy-repository-defectdojo
                      key: api-token
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: ["ALL"]
              resources:
                requests:
                  cpu: 10m
                  memory: 32Mi
                  ephemeral-storage: 16Mi
                limits:
                  cpu: 100m
                  memory: 128Mi
                  ephemeral-storage: 64Mi
              volumeMounts:
                - name: reports
                  mountPath: /reports
                - name: scripts
                  mountPath: /scripts
                  readOnly: true
          volumes:
            - name: reports
              emptyDir:
                sizeLimit: 64Mi
            - name: cache
              emptyDir:
                sizeLimit: 256Mi
            - name: tmp
              emptyDir:
                sizeLimit: 2Gi
            - name: workspace
              emptyDir:
                sizeLimit: 256Mi
            - name: git-tmp
              emptyDir:
                sizeLimit: 16Mi
            - name: scripts
              configMap:
                name: security-trivy-repository-processing
                defaultMode: 0555
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: security-trivy-repository-star-dust
  labels:
    security.no-name.win/trivy-scan-excluded: "true"
  annotations:
    argocd.argoproj.io/ignore-healthcheck: "true"
spec:
  schedule: "15 23 * * *"
  timeZone: Europe/Istanbul
  suspend: false
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 900
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    metadata:
      labels:
        security.no-name.win/trivy-scan-excluded: "true"
    spec:
      activeDeadlineSeconds: 3600
      backoffLimit: 0
      ttlSecondsAfterFinished: 86400
      template:
        metadata:
          labels:
            app.kubernetes.io/name: security-trivy-repository-star-dust
            security.no-name.win/trivy-scan-excluded: "true"
        spec:
          serviceAccountName: security-trivy-repository
          automountServiceAccountToken: false
          restartPolicy: Never
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            fsGroup: 1000
            seccompProfile:
              type: RuntimeDefault
          initContainers:
            - name: checkout
              image: docker.io/alpine/git:2.52.0@sha256:4a0e72d49596a1f5d3701aeedafdadc5c0da4062be4657c7bdc4017387f591cc
              imagePullPolicy: IfNotPresent
              command: ["/bin/sh", "-c"]
              args:
                - git clone --depth=1 --branch main
                  https://github.com/EmrhT/star-dust-travel-agency.git /workspace
              env:
                - name: HOME
                  value: /tmp
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: ["ALL"]
              resources:
                requests:
                  cpu: 25m
                  memory: 32Mi
                  ephemeral-storage: 16Mi
                limits:
                  cpu: 250m
                  memory: 128Mi
                  ephemeral-storage: 64Mi
              volumeMounts:
                - name: workspace
                  mountPath: /workspace
                - name: git-tmp
                  mountPath: /tmp
            - name: dotnet-lockfiles
              image: mcr.microsoft.com/dotnet/sdk:10.0-alpine@sha256:0294f285d062afacc8b5f6d7febb0cd4ee879320e5585fa15f2f4ebf1feb9ba7
              imagePullPolicy: IfNotPresent
              command: ["/bin/sh", "-c"]
              args:
                - >-
                  mkdir -p /tmp/xdg /tmp/home /tmp/dotnet &&
                  chmod 0700 /tmp/xdg &&
                  dotnet restore
                  /workspace/backend/src/StarDustTravelAgency.Api/StarDustTravelAgency.Api.csproj
                  --use-lock-file --packages /nuget &&
                  dotnet restore
                  /workspace/backend/tests/StarDustTravelAgency.Api.Tests/StarDustTravelAgency.Api.Tests.csproj
                  --use-lock-file --packages /nuget
              env:
                - name: HOME
                  value: /tmp/home
                - name: DOTNET_CLI_HOME
                  value: /tmp/dotnet
                - name: NUGET_PACKAGES
                  value: /nuget
                - name: DOTNET_NOLOGO
                  value: "true"
                - name: DOTNET_CLI_TELEMETRY_OPTOUT
                  value: "true"
                - name: DOTNET_SKIP_FIRST_TIME_EXPERIENCE
                  value: "true"
                - name: NUGET_XMLDOC_MODE
                  value: skip
                - name: TMPDIR
                  value: /tmp
                - name: XDG_RUNTIME_DIR
                  value: /tmp/xdg
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: ["ALL"]
              resources:
                requests:
                  cpu: 100m
                  memory: 256Mi
                  ephemeral-storage: 256Mi
                limits:
                  cpu: "1"
                  memory: 1Gi
                  ephemeral-storage: 2Gi
              volumeMounts:
                - name: workspace
                  mountPath: /workspace
                - name: nuget
                  mountPath: /nuget
                - name: dotnet-tmp
                  mountPath: /tmp
            - name: scanner
              image: docker.io/aquasec/trivy:0.76.2@sha256:6fa071ef8daa2e58b90cbf1710bedca91adbb3bf98693533226f442035b836a6
              imagePullPolicy: IfNotPresent
              command: ["trivy"]
              args:
                - repository
                - --server
                - http://security-trivy.security-trivy.svc.cluster.local:4954
                - --scanners
                - vuln
                - --severity
                - UNKNOWN,MEDIUM,HIGH,CRITICAL
                - --format
                - json
                - --output
                - /reports/trivy-raw.json
                - --timeout
                - 30m
                - --cache-dir
                - /cache
                - --no-progress
                - --include-dev-deps
                - --skip-dirs
                - '**/obj'
                - /workspace
              env:
                - name: TMPDIR
                  value: /tmp/trivy
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: ["ALL"]
              resources:
                requests:
                  cpu: 100m
                  memory: 256Mi
                  ephemeral-storage: 256Mi
                limits:
                  cpu: "1"
                  memory: 1Gi
                  ephemeral-storage: 2Gi
              volumeMounts:
                - name: reports
                  mountPath: /reports
                - name: cache
                  mountPath: /cache
                - name: tmp
                  mountPath: /tmp/trivy
                - name: workspace
                  mountPath: /workspace
                  readOnly: true
            - name: normalizer
              image: docker.io/mikefarah/yq:4.49.2@sha256:224eec1bdaf4903221117d65dd95a0f4f4a6d4e46c88e2c81e09398d1f2753a1
              imagePullPolicy: IfNotPresent
              command: ["/bin/sh", "/scripts/normalize.sh"]
              env:
                - name: REPOSITORY_NAME
                  value: star-dust-travel-agency
                - name: REPOSITORY_URL
                  value: https://github.com/EmrhT/star-dust-travel-agency.git
                - name: PAGERDUTY_ROUTING_KEY
                  valueFrom:
                    secretKeyRef:
                      name: security-trivy-repository-pagerduty
                      key: routing-key
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: ["ALL"]
              resources:
                requests:
                  cpu: 25m
                  memory: 64Mi
                  ephemeral-storage: 16Mi
                limits:
                  cpu: 250m
                  memory: 256Mi
                  ephemeral-storage: 64Mi
              volumeMounts:
                - name: reports
                  mountPath: /reports
                - name: scripts
                  mountPath: /scripts
                  readOnly: true
          containers:
            - name: uploader
              image: docker.io/curlimages/curl:8.23.0@sha256:3fb7e13e5d179a845c97d78204f3f1064d1907037f26a3ebf91710571151fd93
              imagePullPolicy: IfNotPresent
              command: ["/bin/sh", "/scripts/upload.sh"]
              env:
                - name: REPOSITORY_NAME
                  value: star-dust-travel-agency
                - name: REPOSITORY_BRANCH
                  value: main
                - name: ENGAGEMENT_NAME
                  value: Star Dust Travel Agency
                - name: DEFECTDOJO_API_TOKEN
                  valueFrom:
                    secretKeyRef:
                      name: security-trivy-repository-defectdojo
                      key: api-token
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: ["ALL"]
              resources:
                requests:
                  cpu: 10m
                  memory: 32Mi
                  ephemeral-storage: 16Mi
                limits:
                  cpu: 100m
                  memory: 128Mi
                  ephemeral-storage: 64Mi
              volumeMounts:
                - name: reports
                  mountPath: /reports
                - name: scripts
                  mountPath: /scripts
                  readOnly: true
          volumes:
            - name: reports
              emptyDir:
                sizeLimit: 64Mi
            - name: cache
              emptyDir:
                sizeLimit: 256Mi
            - name: tmp
              emptyDir:
                sizeLimit: 2Gi
            - name: workspace
              emptyDir:
                sizeLimit: 1Gi
            - name: git-tmp
              emptyDir:
                sizeLimit: 16Mi
            - name: nuget
              emptyDir:
                sizeLimit: 1Gi
            - name: dotnet-tmp
              emptyDir:
                sizeLimit: 256Mi
            - name: scripts
              configMap:
                name: security-trivy-repository-processing
                defaultMode: 0555
