apiVersion: v1
kind: ConfigMap
metadata:
  name: security-trivy-repository-processing
data:
  normalize.sh: |
    #!/bin/sh
    set -eu

    raw=/reports/trivy-raw.json
    normalized=/reports/trivy.json
    events=/reports/pagerduty-events.jsonl

    test -s "${raw}"
    : "${REPOSITORY_NAME:?REPOSITORY_NAME is required}"
    : "${PAGERDUTY_ROUTING_KEY:?PAGERDUTY_ROUTING_KEY is required}"

    export SCAN_DATE="$(date -u +%F)"

    # Trivy normally derives severity from vendor data. Preserve MEDIUM and
    # above, and promote score-backed UNKNOWN entries so DefectDojo's Medium
    # threshold and the numeric PagerDuty threshold do not lose them.
    yq -o=json '(
      .Results[]?.Vulnerabilities[]?
      | select(
          .Severity == "UNKNOWN" and
          (([((.CVSS // {})[] | [.V4Score, .V3Score, .V2Score][])] | map(select(. != null)) | max // 0) >= 9)
        )
      | .Severity
    ) = "CRITICAL" |
    (
      .Results[]?.Vulnerabilities[]?
      | select(
          .Severity == "UNKNOWN" and
          (([((.CVSS // {})[] | [.V4Score, .V3Score, .V2Score][])] | map(select(. != null)) | max // 0) >= 7)
        )
      | .Severity
    ) = "HIGH"' "${raw}" > "${normalized}"

    # Emit complete PagerDuty Events API payloads. The date in dedup_key makes
    # an unresolved CVSS >=9 finding produce one new incident on each daily
    # scan, while retries of the same scan remain deduplicated.
    yq -o=json -I=0 '
      [
        .Results[]? as $result |
        $result.Vulnerabilities[]? |
        . as $vulnerability |
        ([((.CVSS // {})[] | [.V4Score, .V3Score, .V2Score][])] | map(select(. != null)) | max // 0) as $score |
        {
          "result": $result,
          "vulnerability": $vulnerability,
          "score": $score
        }
      ] |
      map(select(.score >= 9)) |
      .[] |
      .result as $result |
      .vulnerability as $vulnerability |
      .score as $score |
      {
        "routing_key": strenv(PAGERDUTY_ROUTING_KEY),
        "event_action": "trigger",
        "dedup_key": (
          "trivy-repository:" + strenv(REPOSITORY_NAME) + ":" +
          $vulnerability.VulnerabilityID + ":" + $vulnerability.PkgName + ":" + strenv(SCAN_DATE)
        ),
        "payload": {
          "summary": (
            strenv(REPOSITORY_NAME) + " contains " + $vulnerability.VulnerabilityID +
            " in " + $vulnerability.PkgName + " with CVSS " + ($score | tostring)
          ),
          "source": "security-trivy-repository",
          "severity": "critical",
          "component": $vulnerability.PkgName,
          "group": strenv(REPOSITORY_NAME),
          "class": "repository-dependency-vulnerability",
          "custom_details": {
            "repository": strenv(REPOSITORY_URL),
            "target": $result.Target,
            "vulnerability_id": $vulnerability.VulnerabilityID,
            "package": $vulnerability.PkgName,
            "installed_version": $vulnerability.InstalledVersion,
            "fixed_version": ($vulnerability.FixedVersion // "not available"),
            "cvss_score": $score,
            "scan_date": strenv(SCAN_DATE)
          }
        }
      }' "${normalized}" > "${events}"

    chmod 0600 "${normalized}" "${events}"

  upload.sh: |
    #!/bin/sh
    set -eu

    report=/reports/trivy.json
    events=/reports/pagerduty-events.jsonl
    response=/reports/defectdojo-response.json
    curl_config=/reports/defectdojo.curl
    pagerduty_event=/reports/pagerduty-event.json

    test -s "${report}"
    : "${DEFECTDOJO_API_TOKEN:?DEFECTDOJO_API_TOKEN is required}"
    : "${REPOSITORY_NAME:?REPOSITORY_NAME is required}"
    : "${ENGAGEMENT_NAME:?ENGAGEMENT_NAME is required}"

    trap 'rm -f "${curl_config}" "${pagerduty_event}"' EXIT
    scan_timestamp="$(date -u +%Y%m%dT%H%M%SZ)"
    scan_date="$(date -u +%F)"
    printf 'header = "Authorization: Token %s"\n' "${DEFECTDOJO_API_TOKEN}" > "${curl_config}"
    chmod 0600 "${curl_config}"

    upload_report() {
      endpoint="$1"
      curl --silent --show-error \
        --config "${curl_config}" \
        --http1.1 \
        --connect-timeout 10 \
        --max-time 300 \
        --output "${response}" \
        --write-out '%{http_code}' \
        --header 'Accept: application/json' \
        --header 'Expect:' \
        --header 'Connection: close' \
        --header 'Host: dojo.no-name.win' \
        --form 'scan_type=Trivy Scan' \
        --form 'test_title=Scheduled repository dependency scan' \
        --form "engagement_name=${ENGAGEMENT_NAME}" \
        --form 'product_name=Application CI/CD security findings - homelab' \
        --form 'auto_create_context=true' \
        --form "file=@${report};type=application/json" \
        --form 'minimum_severity=Medium' \
        --form 'active=true' \
        --form 'verified=false' \
        --form 'close_old_findings=true' \
        --form "build_id=scheduled-${scan_timestamp}" \
        --form "branch_tag=${REPOSITORY_BRANCH}" \
        --form "scan_date=${scan_date}" \
        "http://security-defectdojo-django.security-defectdojo.svc.cluster.local/api/v2/${endpoint}/"
    }

    curl_exit=0
    http_status="$(upload_report reimport-scan)" || curl_exit=$?
    if [ "${http_status}" = 400 ]; then
      echo "The recurring repository Test does not exist yet; creating it with import-scan"
      curl_exit=0
      http_status="$(upload_report import-scan)" || curl_exit=$?
    fi

    case "${http_status}" in
      200|201|202)
        echo "DefectDojo accepted ${REPOSITORY_NAME} (HTTP ${http_status}, curl ${curl_exit})"
        ;;
      *)
        echo "DefectDojo rejected ${REPOSITORY_NAME} (HTTP ${http_status}, curl ${curl_exit})" >&2
        head -c 4000 "${response}" >&2 || true
        exit 1
        ;;
    esac

    alert_count=0
    if [ -s "${events}" ]; then
      while IFS= read -r event; do
        [ -n "${event}" ] || continue
        printf '%s\n' "${event}" > "${pagerduty_event}"
        pagerduty_status="$(curl --silent --show-error \
          --connect-timeout 10 \
          --max-time 60 \
          --output /dev/null \
          --write-out '%{http_code}' \
          --header 'Content-Type: application/json' \
          --data-binary "@${pagerduty_event}" \
          'https://events.eu.pagerduty.com/v2/enqueue')"
        if [ "${pagerduty_status}" != 202 ]; then
          echo "PagerDuty rejected an event for ${REPOSITORY_NAME} (HTTP ${pagerduty_status})" >&2
          exit 1
        fi
        alert_count=$((alert_count + 1))
      done < "${events}"
    fi
    echo "PagerDuty accepted ${alert_count} CVSS >=9 event(s) for ${REPOSITORY_NAME}"
