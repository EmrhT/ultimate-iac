apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: trivy-repository-defectdojo
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  vaultAuthRef: trivy-dojo
  mount: kv
  type: kv-v2
  path: security/defectdojo/credentials
  refreshAfter: 1m
  hmacSecretData: true
  destination:
    create: true
    overwrite: true
    name: security-trivy-repository-defectdojo
    type: Opaque
    transformation:
      excludeRaw: true
      excludes:
        - '.*'
      templates:
        api-token:
          text: '{{ get .Secrets "defectdojo-api-token" }}'
---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: trivy-repository-pagerduty
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  vaultAuthRef: trivy-dojo
  mount: kv
  type: kv-v2
  path: infra/monitoring/pagerduty
  refreshAfter: 1m
  hmacSecretData: true
  destination:
    create: true
    overwrite: true
    name: security-trivy-repository-pagerduty
    type: Opaque
    transformation:
      excludeRaw: true
      excludes:
        - '.*'
      templates:
        routing-key:
          text: '{{ get .Secrets "service-key" }}'
