apiVersion: v1
kind: ServiceAccount
metadata:
  name: vault-auth
  annotations:
    argocd.argoproj.io/sync-wave: "-30"
---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultAuth
metadata:
  name: defectdojo
  annotations:
    argocd.argoproj.io/sync-wave: "-29"
spec:
  vaultConnectionRef: vault-secrets-operator/default
  method: kubernetes
  mount: kubernetes
  kubernetes:
    role: vso-admin
    serviceAccount: vault-auth
    audiences:
      - vault
---
# One Vault record is transformed into three least-privilege Kubernetes
# Secrets. Raw Vault keys are excluded from every destination Secret.
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: defectdojo-application-credentials
  annotations:
    argocd.argoproj.io/sync-wave: "-28"
spec:
  vaultAuthRef: defectdojo
  mount: kv
  type: kv-v2
  path: security/defectdojo/credentials
  refreshAfter: 1m
  hmacSecretData: true
  destination:
    create: true
    overwrite: true
    name: security-defectdojo
    type: Opaque
    transformation:
      excludeRaw: true
      templates:
        DD_ADMIN_PASSWORD:
          text: '{{ get .Secrets "admin-password" }}'
        DD_SECRET_KEY:
          text: '{{ get .Secrets "django-secret-key" }}'
        DD_CREDENTIAL_AES_256_KEY:
          text: '{{ get .Secrets "credential-aes-256-key" }}'
        METRICS_HTTP_AUTH_PASSWORD:
          text: '{{ get .Secrets "metrics-password" }}'
---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: defectdojo-postgresql-credentials
  annotations:
    argocd.argoproj.io/sync-wave: "-28"
spec:
  vaultAuthRef: defectdojo
  mount: kv
  type: kv-v2
  path: security/defectdojo/credentials
  refreshAfter: 1m
  hmacSecretData: true
  destination:
    create: true
    overwrite: true
    name: security-defectdojo-postgresql-specific
    type: Opaque
    transformation:
      excludeRaw: true
      templates:
        postgresql-postgres-password:
          text: '{{ get .Secrets "postgres-password" }}'
        postgresql-password:
          text: '{{ get .Secrets "postgres-password" }}'
        postgresql-replication-password:
          text: '{{ get .Secrets "postgres-password" }}'
---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: defectdojo-valkey-credentials
  annotations:
    argocd.argoproj.io/sync-wave: "-28"
spec:
  vaultAuthRef: defectdojo
  mount: kv
  type: kv-v2
  path: security/defectdojo/credentials
  refreshAfter: 1m
  hmacSecretData: true
  destination:
    create: true
    overwrite: true
    name: security-defectdojo-valkey-specific
    type: Opaque
    transformation:
      excludeRaw: true
      templates:
        valkey-password:
          text: '{{ get .Secrets "valkey-password" }}'
