apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: security-defectdojo-ci
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: traefik
      namespace: traefik
      sectionName: websecure
  hostnames:
    - ci-dojo.no-name.win
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - group: ""
          kind: Service
          name: security-defectdojo-django
          port: 80
          weight: 1
