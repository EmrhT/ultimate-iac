apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: security-zap
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: traefik
      namespace: traefik
      sectionName: websecure
  hostnames:
    - zap.no-name.win
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - group: ""
          kind: Service
          name: security-zap
          port: 8080
          weight: 1
