apiVersion: v1
kind: ServiceAccount
metadata:
  name: vault-auth
  annotations:
    argocd.argoproj.io/sync-wave: "-30"
---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultAuth
metadata:
  name: zap
  annotations:
    argocd.argoproj.io/sync-wave: "-29"
spec:
  vaultConnectionRef: vault-secrets-operator/default
  method: kubernetes
  mount: kubernetes
  kubernetes:
    role: vso-admin
    serviceAccount: vault-auth
    audiences:
      - vault
---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: zap-api-key
  annotations:
    argocd.argoproj.io/sync-wave: "-28"
spec:
  vaultAuthRef: zap
  mount: kv
  type: kv-v2
  path: security/zap/credentials
  refreshAfter: 1m
  hmacSecretData: true
  destination:
    create: true
    overwrite: true
    name: security-zap-api-key
    type: Opaque
  rolloutRestartTargets:
    - kind: Deployment
      name: security-zap
