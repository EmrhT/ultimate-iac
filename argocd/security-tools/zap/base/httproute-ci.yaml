apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: security-zap-ci
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: traefik
      namespace: traefik
      sectionName: websecure
  hostnames:
    - ci-zap.no-name.win
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      # ZAP's listener is both its management API and a forward proxy. Rewrite
      # the backend authority to ZAP's reserved API hostname so requests for
      # the public CI hostname are handled by the API instead of proxied back
      # through Cloudflare.
      filters:
        - type: URLRewrite
          urlRewrite:
            hostname: zap
      backendRefs:
        - group: ""
          kind: Service
          name: security-zap
          port: 8080
          weight: 1
