apiVersion: v1
kind: ConfigMap
metadata:
  name: security-zap-automation
data:
  podinfo-lab-a-dev.yaml: |
    env:
      contexts:
        - name: podinfo-lab-a-dev
          urls:
            - http://podinfo.lab-a-dev.svc.cluster.local:9898
          includePaths:
            - http://podinfo\.lab-a-dev\.svc\.cluster\.local:9898/.*
      parameters:
        failOnError: true
        failOnWarning: false
        progressToStdout: true

    jobs:
      - type: passiveScan-config
        parameters:
          maxAlertsPerRule: 10
          scanOnlyInScope: true
          maxBodySizeInBytesToScan: 1048576
          enableTags: false

      - type: spider
        parameters:
          context: podinfo-lab-a-dev
          url: http://podinfo.lab-a-dev.svc.cluster.local:9898
          maxDuration: 3
          maxDepth: 3
          maxChildren: 20
          maxParseSizeBytes: 1048576
          parseComments: false
          parseGit: false
          parseDsStore: false
          parseSVNEntries: false
          postForm: false
          threadCount: 1

      - type: passiveScan-wait
        parameters:
          maxDuration: 3

      - type: activeScan
        parameters:
          context: podinfo-lab-a-dev
          url: http://podinfo.lab-a-dev.svc.cluster.local:9898
          maxRuleDurationInMins: 2
          maxScanDurationInMins: 15
          maxAlertsPerRule: 10
          handleAntiCSRFTokens: true
          threadPerHost: 1
        # Define the scan policy in the plan so a clean CI session never
        # depends on policy state created manually in the ZAP UI.
        policyDefinition:
          defaultStrength: Medium
          defaultThreshold: Medium
          rules: []

      - type: passiveScan-wait
        parameters:
          maxDuration: 3
