apiVersion: v1
kind: ServiceAccount
metadata:
  name: vault-auth
  annotations:
    argocd.argoproj.io/sync-wave: "-30"
automountServiceAccountToken: false
---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultAuth
metadata:
  name: trivy-dojo
  annotations:
    argocd.argoproj.io/sync-wave: "-29"
spec:
  vaultConnectionRef: vault-secrets-operator/default
  method: kubernetes
  mount: kubernetes
  kubernetes:
    role: vso-admin
    serviceAccount: vault-auth
    audiences:
      - vault
---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: trivy-dojo-defectdojo-credentials
  annotations:
    argocd.argoproj.io/sync-wave: "-28"
spec:
  vaultAuthRef: trivy-dojo
  mount: kv
  type: kv-v2
  path: security/defectdojo/credentials
  refreshAfter: 1m
  hmacSecretData: true
  destination:
    create: true
    overwrite: true
    # This name is fixed by the trivy-dojo-report-operator chart when
    # fullnameOverride=security-trivy-dojo and createSecret=false.
    name: security-trivy-dojo-defect-dojo-api-credentials
    type: Opaque
    transformation:
      excludeRaw: true
      excludes:
        - '.*'
      templates:
        apiKey:
          text: '{{ get .Secrets "trivy-dojo-api-token" }}'
        url:
          text: 'http://security-defectdojo-django.security-defectdojo.svc.cluster.local'
