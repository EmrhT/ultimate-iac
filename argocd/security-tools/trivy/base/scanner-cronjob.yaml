apiVersion: batch/v1
kind: CronJob
metadata:
  name: security-trivy-scan
spec:
  schedule: "0 0 1 1 *"
  timeZone: Europe/Istanbul
  suspend: true
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 2
  jobTemplate:
    spec:
      backoffLimit: 0
      ttlSecondsAfterFinished: 86400
      template:
        metadata:
          labels:
            app.kubernetes.io/name: security-trivy-scan
        spec:
          automountServiceAccountToken: false
          restartPolicy: Never
          securityContext:
            runAsNonRoot: true
            runAsUser: 65534
            runAsGroup: 65534
            fsGroup: 65534
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: scanner
              image: aquasec/trivy:0.73.0
              imagePullPolicy: IfNotPresent
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: ["ALL"]
              args:
                - image
                - --server
                - http://security-trivy:4954
                - --severity
                - HIGH,CRITICAL
                - --ignore-unfixed
                - --exit-code
                - "1"
                - --no-progress
                - ghcr.io/emrht/podinfo-emrah:latest
              resources:
                requests:
                  cpu: 50m
                  memory: 128Mi
                  ephemeral-storage: 32Mi
                limits:
                  cpu: 500m
                  memory: 512Mi
                  ephemeral-storage: 128Mi
              volumeMounts:
                - name: tmp
                  mountPath: /tmp
          volumes:
            - name: tmp
              emptyDir:
                sizeLimit: 128Mi
