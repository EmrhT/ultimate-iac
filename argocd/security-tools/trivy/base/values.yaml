fullnameOverride: security-trivy

image:
  registry: docker.io
  repository: aquasec/trivy
  tag: 0.73.0@sha256:7cced7cae583819fc7806d4cbc0dbbc7cad18b99f7d3e235192e6da8c091045c

replicaCount: 1

persistence:
  enabled: true
  storageClass: longhorn-trivy
  accessMode: ReadWriteOnce
  size: 2Gi

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: "1"
    memory: 1Gi

podSecurityContext:
  runAsUser: 65534
  runAsNonRoot: true
  fsGroup: 65534
  seccompProfile:
    type: RuntimeDefault

securityContext:
  privileged: false
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: ["ALL"]

trivy:
  debugMode: false
  skipDBUpdate: false
  dbRepository: ghcr.io/aquasecurity/trivy-db
  cache:
    redis:
      enabled: false
  extraEnvVars:
    TRIVY_JAVA_DB_REPOSITORY: ghcr.io/aquasecurity/trivy-java-db

service:
  name: security-trivy
  type: ClusterIP
  port: 4954
  sessionAffinity: ClientIP

ingress:
  enabled: false
