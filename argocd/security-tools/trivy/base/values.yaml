fullnameOverride: security-trivy

image:
  registry: docker.io
  repository: aquasec/trivy
  tag: 0.76.1@sha256:2e6c00d711ab4ae41d8a30c2c1fd3bd3b62704c177bb120f95012e939edfb3df

replicaCount: 1

persistence:
  enabled: true
  storageClass: longhorn-trivy
  accessMode: ReadWriteOnce
  size: 3Gi

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: "1"
    memory: 1Gi

podSecurityContext:
  runAsUser: 65534
  runAsNonRoot: true
  fsGroup: 65534
  seccompProfile:
    type: RuntimeDefault

securityContext:
  privileged: false
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: ["ALL"]

trivy:
  debugMode: false
  skipDBUpdate: false
  dbRepository: ghcr.io/aquasecurity/trivy-db
  labels:
    security.no-name.win/falco-reverse-shell: "true"
    security.no-name.win/falco-web-process: "false"
    security.no-name.win/falco-unexpected-listener: "false"
    security.no-name.win/falco-payload-execution: "true"
    security.no-name.win/falco-container-escape: "true"
    security.no-name.win/falco-unexpected-root: "false"
    security.no-name.win/falco-service-account-access: "true"
  cache:
    redis:
      enabled: false
  extraEnvVars:
    TRIVY_JAVA_DB_REPOSITORY: ghcr.io/aquasecurity/trivy-java-db

service:
  name: security-trivy
  type: ClusterIP
  port: 4954
  sessionAffinity: ClientIP

ingress:
  enabled: false
