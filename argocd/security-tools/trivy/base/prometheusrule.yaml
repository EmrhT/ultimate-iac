apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: security-trivy-storage
  labels:
    release: kube-prometheus-stack
spec:
  groups:
    - name: security-trivy.storage
      rules:
        - alert: SecurityTrivyVolumeNearlyFull
          expr: |
            kubelet_volume_stats_available_bytes{namespace="security-trivy"}
              / kubelet_volume_stats_capacity_bytes{namespace="security-trivy"} < 0.15
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: Trivy cache has less than 15% free space
            description: The cache is disposable; recreate the Trivy claim to reclaim it.
