apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: security-trivy-storage
  labels:
    release: kube-prometheus-stack
spec:
  groups:
    - name: security-trivy.storage
      rules:
        - alert: SecurityTrivyVolumeNearlyFull
          expr: |
            kubelet_volume_stats_available_bytes{namespace="security-trivy"}
              / kubelet_volume_stats_capacity_bytes{namespace="security-trivy"} < 0.15
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: Trivy cache has less than 15% free space
            description: The cache is disposable; recreate the Trivy claim to reclaim it.
    - name: security-trivy.runtime-vulnerabilities
      rules:
        - alert: TrivyRunningImageCVSS9
          expr: |
            trivy_vulnerability_id{
              vuln_score=~"^(9([.][0-9]+)?|10([.]0+)?)$"
            } == 1
          for: 30m
          labels:
            severity: critical
            detector: trivy-operator
            # Route confirmed CVSS 9.0+ findings through the existing
            # security AlertmanagerConfig to PagerDuty.
            team: security
          annotations:
            summary: 'Running image contains {{ $labels.vuln_id }} with CVSS {{ $labels.vuln_score }}'
            description: 'Namespace {{ $labels.namespace }}, {{ $labels.resource_kind }}/{{ $labels.resource_name }}, image {{ $labels.image_repository }}@{{ $labels.image_digest }}.'
            runbook_url: https://github.com/EmrhT/ultimate-iac/blob/main/argocd/security-tools/README.md#trivy-operator-running-image-vulnerability-flow
