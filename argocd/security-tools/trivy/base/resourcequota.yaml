apiVersion: v1
kind: ResourceQuota
metadata:
  name: security-trivy
spec:
  hard:
    # A scan of the nine-container MetalLB FRR DaemonSet can declare
    # 4.5 CPU/4.5 GiB in addition to the Trivy server, operators and other
    # active scan Jobs. Scanner requests remain small, so these limits permit
    # the declared burst without reserving that capacity on the workers.
    requests.cpu: "2"
    requests.memory: 3Gi
    limits.cpu: "10"
    limits.memory: 10Gi
    requests.storage: 2Gi
    persistentvolumeclaims: "1"
    count/jobs.batch: "8"
    count/cronjobs.batch: "2"
