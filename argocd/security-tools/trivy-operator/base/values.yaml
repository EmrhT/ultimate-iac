fullnameOverride: security-trivy-operator

# Discover all currently deployed workload types cluster-wide. Reports expire
# after 24 hours, causing the Operator to rescan unchanged running images with
# the Trivy database maintained by the existing in-cluster server.
targetNamespaces: ""
excludeNamespaces: ""
targetWorkloads: pod,replicaset,replicationcontroller,statefulset,daemonset,cronjob,job

operator:
  replicas: 1
  scanJobsConcurrentLimit: 3
  scanJobTimeout: 40m
  # Retain completed and failed scan Jobs briefly so their status and logs are
  # available for troubleshooting without accumulating them indefinitely.
  scanJobTTL: 10m
  scannerReportTTL: 24h
  vulnerabilityScannerEnabled: true
  vulnerabilityScannerScanOnlyCurrentRevisions: true
  sbomGenerationEnabled: false
  configAuditScannerEnabled: false
  rbacAssessmentScannerEnabled: false
  infraAssessmentScannerEnabled: false
  clusterComplianceEnabled: false
  exposedSecretScannerEnabled: false
  builtInTrivyServer: false
  accessGlobalSecretsAndServiceAccount: true
  metricsFindingsEnabled: true
  # Exposes one metric per CVE with vuln_score so Prometheus can apply the
  # numeric >=9.0 threshold without a report-parsing script.
  metricsVulnIdEnabled: true

image:
  registry: docker.io
  repository: aquasec/trivy-operator
  tag: 0.36.1@sha256:8d1c9f2500bf88efc91d523588d91454e3d1effda595d0ae5c0cd2a0a2a37972

trivyOperator:
  scanJobsInSameNamespace: false
  scanJobAutomountServiceAccountToken: false
  # Skip explicitly labelled, short-lived utility workloads. Their images are
  # implementation details of a scanner run, not persistent cluster services.
  skipResourceByLabels: security.no-name.win/trivy-scan-excluded
  # Runtime vulnerability management and DefectDojo reconciliation must track
  # only the ReplicaSet revision that can currently run Pods.
  vulnerabilityScannerScanOnlyCurrentRevisions: true
  # Accepted-risk image exclusions for workloads whose remediation is blocked
  # by Kubespray/Ansible ownership, a coordinated major upgrade, a pending
  # application rebuild, or the lack of a fixed upstream image. These are exact
  # current image identities rather
  # than repository wildcards: changing a tag or digest automatically returns
  # the replacement image to Trivy scanning. Review and remove each stale
  # exclusion as its owning component is upgraded.
  excludeImages: "quay.io/argoproj/argocd@sha256:c612d570cb6d6ff29afb72932c1bfe98a1ecc234df50f8ea4873fb7066e760fc,ghcr.io/dexidp/dex@sha256:b8469881d3cb3a73001506f0d3aaefecb9c45d2311c1e0f405d8ac538316c59d,public.ecr.aws/docker/library/redis@sha256:08ad0b1d280850169a790dba1393ff7a90aef951fc19632cf4d3ce4f78e679ba,registry.k8s.io/kube-apiserver:v1.35.4,registry.k8s.io/kube-controller-manager:v1.35.4,registry.k8s.io/kube-scheduler:v1.35.4,registry.k8s.io/kube-proxy:v1.35.4,ghcr.io/kube-vip/kube-vip:v1.0.3,ghcr.io/postfinance/kubelet-csr-approver:v1.1.0,registry.k8s.io/coredns/coredns:v1.12.4,registry.k8s.io/dns/k8s-dns-node-cache:1.25.0,registry.k8s.io/cpa/cluster-proportional-autoscaler:v1.8.8,quay.io/cilium/hubble-ui:v0.13.3@sha256:661d5de7050182d495c6497ff0b007a7a1e379648e60830dd68c4d78ae21761d,quay.io/cilium/hubble-ui-backend:v0.13.3@sha256:db1454e45dc39ca41fbf7cad31eec95d99e5b9949c39daaad0fa81ef29d56953,docker.io/hashicorp/vault:1.21.2@sha256:eb0ba6836e8d4699b7a1e8ca70d8433f7b87dcd067e6d82dff237d3ed2600ea0,docker.io/falcosecurity/falco-talon:0.3.0@sha256:0a06b6a5e9f0e45d4ccdcf4c7a8c5ac4156e728f81ffd0122cb6675e3b525b40,docker.elastic.co/elasticsearch/elasticsearch@sha256:0a95b0fb35f3084f5336ec18f9de4469d564fe863c87218916a90ff85cf1f170,docker.io/library/sonarqube:26.7.0.124771-community,ghcr.io/zaproxy/zaproxy:2.17.0@sha256:781a2bdaea47324e7bab583e2263f21d257b0aee61ed51521a5be45f5f5081ef,docker.io/defectdojo/defectdojo-django@sha256:86f69fd745622d61073d1544ca89806c8bff60cdaa333406ce7c7939d3015920,docker.io/defectdojo/defectdojo-nginx@sha256:24dd1902a06cdaa40d49df7b68300c803b3525cc17538f573548cf4f59703187,us-docker.pkg.dev/os-public-container-registry/defectdojo/bitnami/postgresql@sha256:926356130b77d5742d8ce605b258d35db9b62f2f8fd1601f9dbaef0c8a710a8d,ghcr.io/emrht/mkdocs-content-general@sha256:5d67294998004921f2e38ea5ef66ada692cd43e3929a4867dfce7c68ad23b684,ghcr.io/emrht/mkdocs-content-infra@sha256:bd5d24b2f39fe4ffa6cc8830c975d65536b039729f1ebe81d645f3d65fe2368e,ghcr.io/emrht/mkdocs-content-security@sha256:e7c6ff611c2bdb5d204d2b1baf562c73ddf7db0cf12d9ac98dd348cf5ae999d0,docker.io/projectdiscovery/nuclei:v3.11.1@sha256:9fd705284ac4b5f721fa1e23bf366f26e985cd4ec65927fe9a53cb3fcb0417a6,nicolaka/netshoot:v0.16@sha256:b09d9b21381f47a79b3cbcb30da25266dc17186ea00ae65e99fdc51396f48e70"
  scanJobPodTemplatePodSecurityContext:
    runAsNonRoot: true
    runAsUser: 65534
    runAsGroup: 65534
    fsGroup: 65534
    seccompProfile:
      type: RuntimeDefault
  scanJobPodTemplateContainerSecurityContext:
    runAsNonRoot: true
    runAsUser: 65534
    runAsGroup: 65534
    privileged: false
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    capabilities:
      drop: ["ALL"]
    seccompProfile:
      type: RuntimeDefault

trivy:
  image:
    registry: docker.io
    repository: aquasec/trivy
    tag: 0.76.2@sha256:6fa071ef8daa2e58b90cbf1710bedca91adbb3bf98693533226f442035b836a6
  command: image
  vulnType: os,library
  offlineScan: false
  mode: ClientServer
  serverURL: http://security-trivy.security-trivy.svc.cluster.local:4954
  clientServerSkipUpdate: true
  severity: HIGH,CRITICAL
  # Keep fields required for numeric CVSS paging, remediation and DefectDojo.
  # Descriptions and reference-link arrays are deliberately omitted because
  # repeating them for every finding can push VulnerabilityReport CRs beyond
  # etcd's request-size limit.
  additionalVulnerabilityReportFields: CVSS,Target,Class,PackagePath,PackageType
  slow: true
  timeout: 40m0s
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
      ephemeralStorage: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi
      # Large images such as Elasticsearch can exceed 1Gi while Trivy
      # extracts and analyzes their layers. Keep the request small, but allow
      # each scanner container enough temporary space to finish.
      ephemeralStorage: 3Gi

serviceMonitor:
  enabled: true
  labels:
    release: kube-prometheus-stack

podSecurityContext:
  runAsNonRoot: true
  seccompProfile:
    type: RuntimeDefault

securityContext:
  privileged: false
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: ["ALL"]

resources:
  requests:
    cpu: 250m
    memory: 512Mi
  limits:
    cpu: "1"
    memory: 1Gi

# The vulnerability-only deployment does not need dormant compliance spec CRs.
compliance:
  specs: []
