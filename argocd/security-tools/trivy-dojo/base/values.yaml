fullnameOverride: security-trivy-dojo

# Vault Secrets Operator creates the exact Secret name expected by this chart.
defectDojoApiCredentials:
  createSecret: false

excludedNamespaces:
  - lab-a-dev
  - lab-a-prod
  - lab-a-prod-*
  - lab-b-*

operator:
  replicas: 1
  trivyDojoReportOperator:
    image:
      repository: ghcr.io/telekom-mms/docker-trivy-dojo-operator
      tag: 0.11.1@sha256:743cbbce5eaf392b6c04699ff36b626bdfdbed98f489e3b69d2a35d7b666ce8f
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        cpu: 500m
        memory: 1Gi
    env:
      defectDojoActive: "true"
      defectDojoAutoCreateContext: "true"
      # Each report is isolated by namespace, stable workload/container test,
      # and stable service identity, so a reimport only closes findings for the
      # workload/container represented by that report.
      defectDojoCloseOldFindings: "true"
      defectDojoCloseOldFindingsProductScope: "false"
      defectDojoDeduplicationOnEngagement: "true"
      defectDojoDoNotReactivate: "false"
      defectDojoMinimumSeverity: High
      defectDojoProductName: Kubernetes runtime image vulnerabilities - homelab cluster
      defectDojoProductDescription: Current HIGH and CRITICAL vulnerabilities in container images running in the homelab Kubernetes cluster
      defectDojoProductTypeName: Homelab Infrastructure
      defectDojoEngagementName: 'f"Namespace: {meta[''namespace'']}"'
      defectDojoEvalEngagementName: "true"
      defectDojoEnvName: Development
      # ReplicaSet names contain the rollout hash. Strip only that final
      # segment so successive revisions map to the same workload Test.
      defectDojoTestTitle: 'f"Workload: {meta[''labels''][''trivy-operator.resource.name''].rsplit(''-'', 1)[0] if meta[''labels''][''trivy-operator.resource.kind''] == ''ReplicaSet'' else meta[''labels''][''trivy-operator.resource.name'']} / container: {meta[''labels''][''trivy-operator.container.name'']}"'
      defectDojoEvalTestTitle: "true"
      defectDojoServiceName: 'f"{meta[''namespace'']}/{meta[''labels''][''trivy-operator.resource.name''].rsplit(''-'', 1)[0] if meta[''labels''][''trivy-operator.resource.kind''] == ''ReplicaSet'' else meta[''labels''][''trivy-operator.resource.name'']}/{meta[''labels''][''trivy-operator.container.name'']}"'
      defectDojoEvalServiceName: "true"
      # Empty tags avoid concurrent reimports racing while replacing tags on
      # a shared DefectDojo Test. Namespace/workload identity is structural.
      defectDojoTags: ""
      # Scanner output is not equivalent to human verification in DefectDojo.
      defectDojoVerified: "false"
      reports: vulnerabilityreports
      logLevel: INFO
    transformation:
      # Trivy can retain UNKNOWN as the vendor severity even when a numeric
      # CVSS score is available. Normalize only score-backed UNKNOWN findings
      # so DefectDojo's minimum severity of High includes them. Existing HIGH
      # and CRITICAL findings pass through unchanged and nothing is filtered.
      enabled: true
      interpreter: bash
      scanType: Trivy Operator Scan
      scriptFilename: normalize-unknown-severity.sh
      scriptConfigMap:
        create: true
        data:
          normalize-unknown-severity.sh: |
            #!/bin/bash
            set -euo pipefail
            exec jq -f /scripts/normalize-unknown-severity.jq
          normalize-unknown-severity.jq: |
            .report.vulnerabilities |= map(
              if .severity == "UNKNOWN" and (try (.score | tonumber) catch 0) >= 9 then
                .severity = "CRITICAL"
              elif .severity == "UNKNOWN" and (try (.score | tonumber) catch 0) >= 7 then
                .severity = "HIGH"
              else
                .
              end
            )
            | .report.vulnerabilities as $findings
            | .report.summary.criticalCount = ([$findings[] | select(.severity == "CRITICAL")] | length)
            | .report.summary.highCount = ([$findings[] | select(.severity == "HIGH")] | length)
            | .report.summary.unknownCount = ([$findings[] | select(.severity == "UNKNOWN")] | length)
