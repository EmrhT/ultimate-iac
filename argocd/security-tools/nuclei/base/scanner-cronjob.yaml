apiVersion: batch/v1
kind: CronJob
metadata:
  name: security-nuclei-scan
spec:
  schedule: "0 */6 * * *"
  timeZone: Europe/Istanbul
  suspend: false
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 2
  jobTemplate:
    spec:
      activeDeadlineSeconds: 3600
      backoffLimit: 0
      ttlSecondsAfterFinished: 86400
      template:
        metadata:
          labels:
            app.kubernetes.io/name: security-nuclei-scan
        spec:
          automountServiceAccountToken: false
          restartPolicy: Never
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            fsGroup: 1000
            seccompProfile:
              type: RuntimeDefault
          initContainers:
            - name: scanner
              image: projectdiscovery/nuclei:v3.11.1
              imagePullPolicy: IfNotPresent
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: ["ALL"]
              args:
                - -u
                - http://podinfo.lab-a-dev.svc.cluster.local:9898
                - -severity
                - medium,high,critical
                - -jsonl
                - -output
                - /reports/nuclei.jsonl
                - -silent
                - -no-color
                - -update-template-dir
                - /home/nuclei/nuclei-templates
              env:
                - name: HOME
                  value: /home/nuclei
              resources:
                requests:
                  cpu: 100m
                  memory: 128Mi
                  ephemeral-storage: 32Mi
                limits:
                  cpu: "1"
                  memory: 1Gi
                  ephemeral-storage: 256Mi
              volumeMounts:
                - name: home
                  mountPath: /home/nuclei
                - name: tmp
                  mountPath: /tmp
                - name: reports
                  mountPath: /reports
          containers:
            - name: defectdojo-uploader
              image: curlimages/curl:8.21.0
              imagePullPolicy: IfNotPresent
              command:
                - /bin/sh
                - -ec
              args:
                - |
                  report=/reports/nuclei.jsonl
                  response=/reports/defectdojo-response.json
                  test -f "${report}"

                  scan_timestamp="$(date -u +%Y%m%dT%H%M%SZ)"
                  scan_date="$(date -u +%F)"
                  http_status="$(curl --silent --show-error \
                    --retry 5 \
                    --retry-all-errors \
                    --retry-delay 10 \
                    --connect-timeout 10 \
                    --max-time 120 \
                    --output "${response}" \
                    --write-out '%{http_code}' \
                    --header "Authorization: Token ${DEFECTDOJO_API_TOKEN}" \
                    --form 'scan_type=Nuclei Scan' \
                    --form 'test_title=Nuclei recurring lab-a-dev' \
                    --form 'engagement_name=Recurring security scan' \
                    --form 'product_name=podinfo' \
                    --form 'auto_create_context=true' \
                    --form "file=@${report};type=application/x-ndjson" \
                    --form 'minimum_severity=Info' \
                    --form 'active=true' \
                    --form 'verified=false' \
                    --form 'close_old_findings=true' \
                    --form "build_id=scheduled-${scan_timestamp}" \
                    --form 'branch_tag=lab-a-dev' \
                    --form "scan_date=${scan_date}" \
                    http://security-defectdojo-django.security-defectdojo.svc.cluster.local/api/v2/reimport-scan/)"

                  case "${http_status}" in
                    200|201|202)
                      echo "DefectDojo accepted the Nuclei report (HTTP ${http_status})"
                      ;;
                    *)
                      echo "DefectDojo rejected the Nuclei report (HTTP ${http_status})" >&2
                      cat "${response}" >&2
                      exit 1
                      ;;
                  esac
              env:
                - name: DEFECTDOJO_API_TOKEN
                  valueFrom:
                    secretKeyRef:
                      name: security-nuclei-defectdojo
                      key: api-token
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: ["ALL"]
              resources:
                requests:
                  cpu: 10m
                  memory: 16Mi
                  ephemeral-storage: 16Mi
                limits:
                  cpu: 100m
                  memory: 64Mi
                  ephemeral-storage: 64Mi
              volumeMounts:
                - name: reports
                  mountPath: /reports
          volumes:
            - name: home
              emptyDir:
                sizeLimit: 256Mi
            - name: tmp
              emptyDir:
                sizeLimit: 64Mi
            - name: reports
              emptyDir:
                sizeLimit: 32Mi
