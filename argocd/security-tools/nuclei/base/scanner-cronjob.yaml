apiVersion: batch/v1
kind: CronJob
metadata:
  name: security-nuclei-scan
  annotations:
    argocd.argoproj.io/ignore-healthcheck: "true"
spec:
  schedule: "0 */6 * * *"
  timeZone: Europe/Istanbul
  suspend: false
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 600
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      activeDeadlineSeconds: 3600
      backoffLimit: 0
      # Preserve failed runs long enough for operators to inspect pod events
      # and logs. The TTL applies to successful and failed Jobs alike.
      ttlSecondsAfterFinished: 86400
      template:
        metadata:
          labels:
            app.kubernetes.io/name: security-nuclei-scan
        spec:
          serviceAccountName: security-nuclei-scan
          automountServiceAccountToken: false
          restartPolicy: Never
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            fsGroup: 1000
            seccompProfile:
              type: RuntimeDefault
          initContainers:
            - name: scanner
              image: docker.io/projectdiscovery/nuclei:v3.11.1@sha256:9fd705284ac4b5f721fa1e23bf366f26e985cd4ec65927fe9a53cb3fcb0417a6
              imagePullPolicy: IfNotPresent
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: ["ALL"]
              args:
                - -u
                - http://podinfo.lab-a-dev-podinfo.svc.cluster.local:9898
                - -severity
                - low,medium,high,critical
                - -jsonl
                - -output
                - /reports/nuclei.jsonl
                - -silent
                - -no-color
                - -update-template-dir
                - /home/nuclei/nuclei-templates
              env:
                - name: HOME
                  value: /home/nuclei
              resources:
                requests:
                  cpu: 100m
                  memory: 512Mi
                  ephemeral-storage: 32Mi
                limits:
                  cpu: "1"
                  # A full template refresh and scan exceeded 1 GiB and was
                  # repeatedly OOMKilled before the uploader could start.
                  memory: 2Gi
                  ephemeral-storage: 256Mi
              volumeMounts:
                - name: home
                  mountPath: /home/nuclei
                - name: tmp
                  mountPath: /tmp
                - name: reports
                  mountPath: /reports
          containers:
            - name: defectdojo-uploader
              image: docker.io/curlimages/curl:8.23.0@sha256:3fb7e13e5d179a845c97d78204f3f1064d1907037f26a3ebf91710571151fd93
              imagePullPolicy: IfNotPresent
              command:
                - /bin/sh
                - -ec
              args:
                - |
                  report=/reports/nuclei.jsonl
                  response=/reports/defectdojo-response.json
                  curl_config=/reports/defectdojo.curl
                  test -f "${report}"
                  trap 'rm -f "${curl_config}"' EXIT

                  scan_timestamp="$(date -u +%Y%m%dT%H%M%SZ)"
                  scan_date="$(date -u +%F)"
                  printf 'header = "Authorization: Token %s"\n' "${DEFECTDOJO_API_TOKEN}" > "${curl_config}"
                  chmod 600 "${curl_config}"

                  upload_report() {
                    endpoint="$1"
                    curl --silent --show-error \
                      --config "${curl_config}" \
                      --http1.1 \
                      --connect-timeout 10 \
                      --max-time 300 \
                      --output "${response}" \
                      --write-out '%{http_code}' \
                      --header 'Accept: application/json' \
                      --header 'Expect:' \
                      --header 'Connection: close' \
                      --header 'Host: dojo.no-name.win' \
                      --form 'scan_type=Nuclei Scan' \
                      --form 'test_title=Nuclei recurring lab-a-dev' \
                      --form 'engagement_name=Podinfo' \
                      --form 'product_name=Application CI/CD security findings - homelab' \
                      --form 'auto_create_context=true' \
                      --form "file=@${report};type=application/x-ndjson" \
                      --form 'minimum_severity=Info' \
                      --form 'active=true' \
                      --form 'verified=false' \
                      --form 'close_old_findings=true' \
                      --form "build_id=scheduled-${scan_timestamp}" \
                      --form 'branch_tag=lab-a-dev' \
                      --form "scan_date=${scan_date}" \
                      "http://security-defectdojo-django.security-defectdojo.svc.cluster.local/api/v2/${endpoint}/"
                  }

                  curl_exit=0
                  http_status="$(upload_report reimport-scan)" || curl_exit=$?

                  if [ "${http_status}" = 400 ]; then
                    echo "The recurring Nuclei test does not exist yet; creating it with import-scan"
                    curl_exit=0
                    http_status="$(upload_report import-scan)" || curl_exit=$?
                  fi

                  case "${http_status}" in
                    200|201|202)
                      echo "DefectDojo accepted the Nuclei report (HTTP ${http_status}, curl ${curl_exit})"
                      ;;
                    *)
                      echo "DefectDojo rejected the Nuclei report (HTTP ${http_status}, curl ${curl_exit})" >&2
                      head -c 4000 "${response}" >&2 || true
                      exit 1
                      ;;
                  esac
              env:
                - name: DEFECTDOJO_API_TOKEN
                  valueFrom:
                    secretKeyRef:
                      name: security-nuclei-defectdojo
                      key: api-token
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: ["ALL"]
              resources:
                requests:
                  cpu: 10m
                  memory: 16Mi
                  ephemeral-storage: 16Mi
                limits:
                  cpu: 100m
                  memory: 64Mi
                  ephemeral-storage: 64Mi
              volumeMounts:
                - name: reports
                  mountPath: /reports
          volumes:
            - name: home
              emptyDir:
                sizeLimit: 256Mi
            - name: tmp
              emptyDir:
                sizeLimit: 64Mi
            - name: reports
              emptyDir:
                sizeLimit: 32Mi
