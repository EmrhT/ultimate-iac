apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base
  - vault-auth.yaml
  - vault-static-secret.yaml
replicas:
  - name: podinfo
    count: 1
labels:
  - pairs:
      platform.example/environment: dev
    includeTemplates: true
patches:
  - target:
      group: apps
      version: v1
      kind: Deployment
      name: podinfo
    patch: |-
      - op: add
        path: /spec/template/spec/containers/0/envFrom
        value:
          - secretRef:
              name: podinfo-vault
