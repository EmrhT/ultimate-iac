apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: podinfo-ingress
spec:
  endpointSelector:
    matchLabels:
      io.cilium.k8s.policy.serviceaccount: podinfo
  ingress:
    # Public and Cloudflare traffic reaches Podinfo through the Traefik Gateway.
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: traefik
            io.cilium.k8s.policy.serviceaccount: traefik
      toPorts:
        - ports:
            - port: "9898"
              protocol: TCP

    # CI-triggered DAST reaches Podinfo directly through its cluster Service.
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: security-zap
            io.cilium.k8s.policy.serviceaccount: security-zap
      toPorts:
        - ports:
            - port: "9898"
              protocol: TCP

    # The scheduled Nuclei scan also uses the cluster Service directly.
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: security-nuclei
            io.cilium.k8s.policy.serviceaccount: security-nuclei-scan
      toPorts:
        - ports:
            - port: "9898"
              protocol: TCP

    # Keep node-originated kubelet readiness and liveness probes available.
    - fromEntities:
        - host
      toPorts:
        - ports:
            - port: "9898"
              protocol: TCP
---
# This policy is dormant until Falco Talon adds the quarantined label after a
# high-confidence runtime detection. Cilium deny rules take precedence over the
# normal ingress allow rules above, containing both inbound and outbound traffic.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: podinfo-quarantine
spec:
  endpointSelector:
    matchLabels:
      io.cilium.k8s.policy.serviceaccount: podinfo
      k8s:security.no-name.win/quarantined: "true"
  # Empty endpoint selectors deny traffic from/to every Cilium-managed Pod.
  # Entity rules additionally cover host, world, and other non-endpoint identities.
  ingressDeny:
    - fromEndpoints:
        - {}
    - fromEntities: ["all"]
  egressDeny:
    - toEndpoints:
        - {}
    - toEntities: ["all"]
