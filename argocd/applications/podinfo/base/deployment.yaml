apiVersion: apps/v1
kind: Deployment
metadata:
  name: podinfo
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: podinfo
  template:
    metadata:
      labels:
        app.kubernetes.io/name: podinfo
        # Falco rules are independently enabled per workload. Missing or false
        # labels leave the corresponding detector disabled.
        security.no-name.win/falco-reverse-shell: "true"
        security.no-name.win/falco-web-process: "true"
        security.no-name.win/falco-unexpected-listener: "true"
        security.no-name.win/falco-payload-execution: "true"
        security.no-name.win/falco-escape-tools: "true"
        security.no-name.win/falco-unexpected-root: "true"
        security.no-name.win/falco-service-account-access: "true"
    spec:
      serviceAccountName: podinfo
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10000
        runAsGroup: 10000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: podinfo
          image: ghcr.io/emrht/podinfo-emrah:6.14.1
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 9898
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 20m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
      terminationGracePeriodSeconds: 15
