apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../../environments/dev
images:
  - name: ghcr.io/emrht/podinfo-emrah
    newName: ghcr.io/emrht/podinfo-emrah
    digest: sha256:2872b34c8d44b766f057246f0719b28d5b4b7a2f819f07206d6a63c07b11f8b7
labels:
  - pairs:
      platform.example/cluster: lab-a
    includeTemplates: true
patches:
  - target:
      group: gateway.networking.k8s.io
      version: v1
      kind: HTTPRoute
      name: podinfo
    patch: |-
      - op: replace
        path: /spec/hostnames/0
        value: podinfo-lab-a-dev.no-name.win
      - op: add
        path: /spec/hostnames/-
        value: ci-podinfo-lab-a-dev.no-name.win
