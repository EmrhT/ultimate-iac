apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: mkdocs-general-oauth2-proxy
spec:
  vaultAuthRef: mkdocs-general
  mount: kv
  type: kv-v2
  path: dev/mkdocs/general
  refreshAfter: 1m
  hmacSecretData: true
  destination:
    create: true
    overwrite: true
    name: mkdocs-general-oauth2-proxy
    type: Opaque
  rolloutRestartTargets:
    - kind: Deployment
      name: mkdocs-general-oauth2-proxy
---
