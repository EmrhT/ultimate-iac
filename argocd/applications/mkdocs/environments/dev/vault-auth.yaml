apiVersion: v1
kind: ServiceAccount
metadata:
  name: mkdocs-general-vault-auth
automountServiceAccountToken: false
---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultAuth
metadata:
  name: mkdocs-general
spec:
  vaultConnectionRef: vault-secrets-operator/default
  method: kubernetes
  mount: kubernetes
  kubernetes:
    role: vso-mkdocs-general-dev
    serviceAccount: mkdocs-general-vault-auth
    audiences:
      - vault
