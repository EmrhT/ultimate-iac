apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: mkdocs-general
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: traefik
      namespace: traefik
      sectionName: websecure
  hostnames:
    - general.invalid
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - group: ""
          kind: Service
          name: mkdocs-general-oauth2-proxy
          port: 4180
          weight: 1
---
