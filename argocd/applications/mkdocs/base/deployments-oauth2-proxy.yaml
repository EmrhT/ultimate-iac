apiVersion: apps/v1
kind: Deployment
metadata:
  name: mkdocs-general-oauth2-proxy
  labels:
    app.kubernetes.io/name: mkdocs-general-oauth2-proxy
    app.kubernetes.io/component: authentication-proxy
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: mkdocs-general-oauth2-proxy
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mkdocs-general-oauth2-proxy
        app.kubernetes.io/part-of: mkdocs
        app.kubernetes.io/component: authentication-proxy
        security.no-name.win/falco-reverse-shell: "true"
        security.no-name.win/falco-web-process: "false"
        security.no-name.win/falco-unexpected-listener: "false"
        security.no-name.win/falco-payload-execution: "true"
        security.no-name.win/falco-container-escape: "true"
        security.no-name.win/falco-unexpected-root: "true"
        security.no-name.win/falco-service-account-access: "false"
        security.no-name.win/falco-talon-quarantine: "true"
    spec:
      serviceAccountName: mkdocs-general-oauth2-proxy
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: oauth2-proxy
          image: quay.io/oauth2-proxy/oauth2-proxy:v7.15.6@sha256:01da265f8e371e6d3043b97829e171f3e4d53f9dc3817be15fb4fc29c92fe2a6
          imagePullPolicy: IfNotPresent
          args:
            - --config=/etc/oauth2-proxy/oauth2-proxy.cfg
          env:
            - name: OAUTH2_PROXY_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: mkdocs-general-oauth2-proxy
                  key: client-secret
            - name: OAUTH2_PROXY_COOKIE_SECRET
              valueFrom:
                secretKeyRef:
                  name: mkdocs-general-oauth2-proxy
                  key: cookie-secret
          ports:
            - name: http
              containerPort: 4180
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /ping
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          resources:
            requests:
              cpu: 20m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
            readOnlyRootFilesystem: true
          volumeMounts:
            - name: config
              mountPath: /etc/oauth2-proxy
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: mkdocs-general-oauth2-proxy
      terminationGracePeriodSeconds: 15
---
