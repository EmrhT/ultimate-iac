apiVersion: apps/v1
kind: Deployment
metadata:
  name: mkdocs-general-nginx
  labels:
    app.kubernetes.io/name: mkdocs-general-nginx
    app.kubernetes.io/component: static-site
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: mkdocs-general-nginx
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mkdocs-general-nginx
        app.kubernetes.io/part-of: mkdocs
        app.kubernetes.io/component: static-site
        security.no-name.win/falco-reverse-shell: "true"
        security.no-name.win/falco-web-process: "false"
        security.no-name.win/falco-unexpected-listener: "false"
        security.no-name.win/falco-payload-execution: "true"
        security.no-name.win/falco-container-escape: "true"
        security.no-name.win/falco-unexpected-root: "true"
        security.no-name.win/falco-service-account-access: "false"
        security.no-name.win/falco-talon-quarantine: "true"
    spec:
      serviceAccountName: mkdocs-general-nginx
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        runAsGroup: 101
        fsGroup: 101
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: nginx
          # The lab-a/dev overlay replaces this bootstrap tag with a CI-produced digest.
          image: ghcr.io/emrht/mkdocs-content-general:bootstrap-required
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 100m
              memory: 64Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
            readOnlyRootFilesystem: true
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 32Mi
      terminationGracePeriodSeconds: 15
---
