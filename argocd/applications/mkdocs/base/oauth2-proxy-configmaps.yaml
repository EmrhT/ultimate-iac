apiVersion: v1
kind: ConfigMap
metadata:
  name: mkdocs-general-oauth2-proxy
data:
  oauth2-proxy.cfg: |
    provider = "keycloak-oidc"
    provider_display_name = "Homelab Keycloak"
    oidc_issuer_url = "https://keycloak.no-name.win/realms/homelab"
    oidc_groups_claim = "groups"
    client_id = "internal-docs-general"
    redirect_url = "https://general.invalid/oauth2/callback"
    scope = "openid profile email groups"
    allowed_groups = ["/docs-readers"]
    email_domains = ["*"]
    code_challenge_method = "S256"
    upstreams = ["http://mkdocs-general-nginx:8080/"]
    http_address = "0.0.0.0:4180"
    reverse_proxy = true
    trusted_proxy_ips = ["10.233.64.0/18"]
    real_client_ip_header = "X-Forwarded-For"
    skip_provider_button = true
    cookie_name = "__Host-mkdocs-general"
    cookie_path = "/"
    cookie_secure = true
    cookie_httponly = true
    cookie_samesite = "lax"
    cookie_expire = "8h"
    cookie_refresh = "1h"
    pass_basic_auth = false
    pass_access_token = false
    pass_authorization_header = false
    pass_user_headers = false
---
