---
kube_version: 1.35.4

container_manager: containerd
etcd_deployment_type: host

kube_network_plugin: cilium
kube_owner: root

# Keep kube-proxy for a conservative Cilium deployment. Service LoadBalancer
# addresses will be managed by GitOps, so Cilium L2 announcements stay disabled.
kube_proxy_mode: ipvs
kube_proxy_strict_arp: true
cilium_kube_proxy_replacement: false
cilium_l2announcements: false

# Keep recent cluster-wide network flows available for troubleshooting through
# Hubble Relay and Hubble UI. The buffer is event-count based and capped by
# Cilium at 65,535 events per node; it is not persistent storage.
cilium_enable_hubble: true
cilium_enable_hubble_ui: true
# Workers use the global maximum. The control-plane override is managed by the
# infra-cilium-config GitOps application through a CiliumNodeConfig object.
cilium_config_extra_vars:
  hubble-event-buffer-capacity: "65535"
cilium_memory_requests: 128Mi
cilium_memory_limit: 768Mi

# Reclaim unused container images before the shared node filesystem reaches
# eviction pressure. DiskPressure remains an emergency boundary at 90% usage,
# while image garbage collection has room to act between 75% and 65% usage.
kubelet_image_gc_high_threshold: 75
kubelet_image_gc_low_threshold: 65
kubelet_config_extra_args:
  imageMinimumGCAge: 10m
  imageMaximumGCAge: 72h
eviction_hard:
  memory.available: 100Mi
  nodefs.available: 10%
  nodefs.inodesFree: 5%
  imagefs.available: 10%
  imagefs.inodesFree: 5%

kube_service_addresses: 10.233.0.0/18
kube_pods_subnet: 10.233.64.0/18
kube_network_node_prefix: 24

dns_mode: coredns
enable_nodelocaldns: true

kube_api_anonymous_auth: true
auto_renew_certificates: true

# Authenticate human Kubernetes users with JWTs issued by the Keycloak
# "homelab" realm. Explicit prefixes keep external identities separate from
# Kubernetes-managed system users and groups.
kube_apiserver_use_authentication_config_file: true
kube_apiserver_authentication_config_jwt:
  - issuer:
      url: https://keycloak.no-name.win/realms/homelab
      audiences:
        - kubernetes
    claimMappings:
      username:
        claim: preferred_username
        prefix: "keycloak:"
      groups:
        claim: groups
        prefix: "keycloak:"

# Preserve the existing anonymous health endpoint behavior during the switch
# to Kubernetes' structured AuthenticationConfiguration API.
kube_apiserver_authentication_config_anonymous:
  enabled: "{{ kube_api_anonymous_auth }}"
  conditions: []

# Metrics Server validates kubelet serving certificates. Have kubelets request
# cluster-signed serving certificates instead of weakening Metrics Server with
# --kubelet-insecure-tls.
kubelet_rotate_server_certificates: true
