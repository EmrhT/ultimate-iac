---
kube_version: 1.35.4

container_manager: containerd
etcd_deployment_type: host

kube_network_plugin: cilium
kube_owner: root

# Keep kube-proxy for a conservative Cilium deployment. Service LoadBalancer
# addresses will be managed by GitOps, so Cilium L2 announcements stay disabled.
kube_proxy_mode: ipvs
kube_proxy_strict_arp: true
cilium_kube_proxy_replacement: false
cilium_l2announcements: false

kube_service_addresses: 10.233.0.0/18
kube_pods_subnet: 10.233.64.0/18
kube_network_node_prefix: 24

dns_mode: coredns
enable_nodelocaldns: true

kube_api_anonymous_auth: true
auto_renew_certificates: true

# Metrics Server validates kubelet serving certificates. Have kubelets request
# cluster-signed serving certificates instead of weakening Metrics Server with
# --kubelet-insecure-tls.
kubelet_rotate_server_certificates: true
