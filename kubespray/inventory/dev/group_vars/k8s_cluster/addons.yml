---
helm_enabled: true

# Longhorn and the cluster-level CSI snapshot controller will be managed by
# the separate top-level GitOps configuration.
csi_snapshot_controller_enabled: false

# Kubespray v2.31.0 bundles cert-manager 1.15.3, which does not support
# Kubernetes 1.35. A compatible release will be managed by the separate
# top-level GitOps configuration.
cert_manager_enabled: false

argocd_enabled: false
argocd_namespace: argocd

# MetalLB and its 192.168.122.120-192.168.122.129 address pool will be
# managed by the separate top-level GitOps configuration.
metallb_enabled: false

# kube-vip owns only the Kubernetes API VIP. It does not allocate service VIPs.
kube_vip_enabled: true
kube_vip_arp_enabled: true
kube_vip_controlplane_enabled: true
kube_vip_services_enabled: false
kube_vip_address: 192.168.122.30
kube_vip_interface: eth0
loadbalancer_apiserver:
  address: 192.168.122.30
  port: 6443
